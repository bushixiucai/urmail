                locale: {type: string, enum: [en, zh-CN]}
                tax:
                  type: object
                  properties:
                    configured: {type: boolean}
                    included_in_total: {type: boolean, enum: [true]}
                    rate_basis_points: {type: integer, minimum: 0, maximum: 10000}
      responses:
        '204': {description: Updated future profile.}
        default: {$ref: '#/components/responses/Error'}
  /billing/subscription:
    get:
      summary: Read effective current rights separately from the final prepaid end and scheduled intention.
      description: Authenticated tenant members may read subscription metadata. Only owner/admin/billing receive management capability and scheduled change metadata. Future prepaid plans do not replace current plan limits early.
      responses:
        '200':
          description: tenant_id, self_service, can_manage_billing, subscription, current effective plan and optional scheduled_change.
        default:
          $ref: '#/components/responses/Error'
  /billing/subscription/change:
    post:
      summary: Record an unfunded plan intention for the next unpaid period.
      description: Requires owner/admin/billing. Explicit plan compatibility and allocated quota/domain/mailbox counts must fit. No charge or entitlement extension occurs. Purchase still requires a signed quote and payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_code]
              properties:
                plan_code:
                  type: string
      responses:
        '200':
          description: change and payment_required=true.
        '409':
          description: Capacity exceeded, subscription changed, or explicit plan relationship requires review.
        default:
          $ref: '#/components/responses/Error'
  /billing/subscription/change/cancel:
    post:
      summary: Cancel an unfunded scheduled intention.
      description: Requires owner/admin/billing. An intention containing paid future terms cannot be silently canceled; use explicit manual refund approval.
      responses:
        '200':
          description: Intention canceled; no paid period changed.
        '409':
          description: PLAN_CHANGE_ALREADY_PAID.
        default:
          $ref: '#/components/responses/Error'
  /billing/subscription/cancel:
    post:
      summary: Cancel further subscription continuation while preserving every prepaid term.
      description: Requires owner/admin/billing. No automatic refund, period truncation, mail deletion, or future charge. Resuming service requires another deliberate payment.
      responses:
        '200':
          description: subscription and effective_at equal to the last prepaid period end.
        default:
          $ref: '#/components/responses/Error'
  /billing/trial:
    post:
      summary: Redeem a tenant's one-time trial-days coupon after independent domain ownership proof.
      description: Requires owner/admin/billing. A trial never stacks or overwrites paid rights. Redemption and bounded trial entitlement are atomic; no order, cash receipt or invoice is fabricated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain_id, coupon_code, plan_code]
              properties:
                domain_id:
