    PaidCalendarSpec:
      type: object
      description: HMAC-bound paid-service calendar. First activation or an expired-service restart has provisional dates until fulfillment; established timezones and historical paid terms never change.
      required: [timezone, anchor_at, version, reanchor, provisional]
      properties:
        timezone:
          type: string
          example: Asia/Shanghai
        anchor_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
        reanchor:
          type: boolean
          description: A complete new cycle after service interruption resets the date anchor, preserving the first billing timezone.
        provisional:
          type: boolean
        wall:
          type: object
          description: Persisted local wall-clock fields, preserving the original day even after a short-month clamp or a later timezone-database update.
          properties:
            timezone: {type: string}
            day: {type: integer, minimum: 1, maximum: 31}
            hour: {type: integer, minimum: 0, maximum: 23}
            minute: {type: integer, minimum: 0, maximum: 59}
            second: {type: integer, minimum: 0, maximum: 59}
            nanosecond: {type: integer, minimum: 0, maximum: 999999999}
    Quote:
      type: object
      properties:
        calendar:
          $ref: '#/components/schemas/PaidCalendarSpec'
        plan_snapshot_digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: HMAC-bound canonical entitlement snapshot digest.
        document_snapshot_digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: HMAC-bound canonical commercial statement snapshot digest.
        tenant_id:
          type: integer
          format: int64
        domain_id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [new, renew, upgrade, downgrade]
        price_version:
          type: integer
          format: int64
        plan_amount_cents:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Undiscounted full cycle price frozen as the upgrade basis.
        subscription_version:
          type: integer
          format: int64
        coupon_code:
          type: string
        plan_code: *id001
        billing_cycle: *id001
        currency: *id001
        base_amount_cents: *id004
        discount_cents: *id004
        prorated_credit_cents: *id004
        final_amount_cents: *id004
        period_start: *id006
        period_end: *id006
        generated_at: *id006
        expires_at: *id006
        digest: *id001
      required:
      - plan_code
      - billing_cycle
      - currency
      - base_amount_cents
      - discount_cents
      - prorated_credit_cents
      - final_amount_cents
      - period_start
      - period_end
      - generated_at
      - expires_at
      - digest
    Refund:
