                    uniqueItems: true
                    items:
                      type: integer
                      minimum: 0
                      maximum: 365
                required:
                - days
        default:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - M5-M7 managed operations
      summary: Read or configure subscription reminder day offsets
      description: Platform admin only. Defaults 7/3/1/0 days. Empty array disables
