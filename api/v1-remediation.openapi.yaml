      description: Requires an active panel Bearer session and current tenant owner/admin role. Writes also require
        X-CSRF-Token and matching Origin/Referer when present. Cross-tenant identifiers are not visible. source must
        remain contact_enrolled. Preserve event_key for the same source/list event; duplicate keys with a different
