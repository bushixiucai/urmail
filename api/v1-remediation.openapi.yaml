  /marketing/reports/campaigns/{id}:
    get:
      operationId: getMarketingCampaignsOutcomeReport
      summary: Read a bounded current outcome snapshot
      description: Owner/admin only. Current status of recipients or enrollments created in [from, until); maximum
        90 days and 10000 complete facts. Later pages require exact from/until/expected_digest; changed facts return
        409. SMTP sent/submitted means acceptance, never delivery or opening. Unknown outcomes remain unknown. Snapshot
        SQL rechecks active actor and current role. No cache.
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: from
        schema:
          type: string
          format: date-time
      - in: query
        name: until
        schema:
          type: string
          format: date-time
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: expected_digest
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      responses:
        '200':
          description: Complete-snapshot digest, recomputable category/state counts, total_facts, page rows and next_offset.
            Each fact includes record_kind, record_id, version, instance_id, email, state, result_code, occurred_at,
            weight, suppressed, uncertain.
        '400':
          description: Invalid window/page
        '403':
          description: Insufficient current role
        '404':
          description: Unknown resource or current actor not authorized
        '409':
          description: Snapshot changed
        '413':
          description: Complete report exceeds budget
  /marketing/reports/campaigns/{id}/export:
    post:
      operationId: exportMarketingCampaignsOutcomeReport
      summary: Export all facts from the explicitly confirmed snapshot
      description: Owner/admin with CSRF. Re-read complete facts and require expected_digest match. CSV includes metadata
        row containing counters, scope, digest and total facts, followed by every fact; never just the current page.
        Maximum 10000 facts / 4 MiB / 90 days / 5 second SQL budget. Formula-like cells are apostrophe escaped. Audit
        EXPORT marketing.report is committed before response publication, binding resource/window/digest/fact count/byte
        size. At most 10 export requests per tenant per minute.
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          minimum: 1
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - from
              - until
              - expected_digest
              - confirmed
              properties:
                from:
                  type: string
                  format: date-time
                until:
                  type: string
                  format: date-time
                expected_digest:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                confirmed:
                  type: boolean
                  enum:
                  - true
      responses:
        '200':
          description: Complete audited CSV with X-UrMail-Report-Digest header and ASCII attachment filename
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid explicit confirmation/window
        '403':
          description: Insufficient active actor role or CSRF
        '404':
          description: Resource unavailable
        '409':
          description: Snapshot changed
        '413':
          description: Facts or CSV exceed complete-export budget
        '429':
          description: Export rate exceeded
