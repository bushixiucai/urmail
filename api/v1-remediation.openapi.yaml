      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Current local mailbox outcome.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recall:
                    $ref: '#/components/schemas/Recall'
        default:
          $ref: '#/components/responses/Error'
  /audit:
    get:
      summary: Read tenant audit history with stable composite pagination.
      parameters:
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500}}
      - {name: actor_user_id, in: query, schema: {type: integer, format: int64}}
      - {name: action, in: query, schema: {type: string}}
      - {name: target_type, in: query, schema: {type: string}}
      - {name: target_id, in: query, schema: {type: string}}
      - {name: from, in: query, schema: {type: string, format: date-time}}
      - {name: to, in: query, schema: {type: string, format: date-time}}
      - {name: cursor, in: query, schema: {type: string, maxLength: 2048}}
      - {name: before_id, in: query, schema: {type: integer}, description: Legacy cursor; resolves the anchor timestamp within this tenant. Cannot be combined with cursor.}
      responses:
        '200':
          description: logs plus next_cursor; cursor binds tenant and filters and validates its persisted timestamp/id anchor.
        '400':
          description: Invalid range, cursor, or cursor/filter mismatch.
        default:
          $ref: '#/components/responses/Error'
  /audit/export:
    get:
      summary: Export one consistent filtered audit metadata snapshot as CSV.
      parameters:
      - {name: actor_user_id, in: query, schema: {type: integer, format: int64}}
      - {name: action, in: query, schema: {type: string}}
      - {name: target_type, in: query, schema: {type: string}}
      - {name: target_id, in: query, schema: {type: string}}
      - {name: from, in: query, schema: {type: string, format: date-time}}
      - {name: to, in: query, schema: {type: string, format: date-time}}
      description: Requires tenant owner/admin. Uses the same actor/action/object/from/to filters as GET /audit, without page cursors. More than 10000 rows or 7 MiB returns 413 before releasing data, never a silently truncated file. Download is audited before the transaction commits and releases the response. CSV formula prefixes are escaped.
      responses:
        '200':
          description: Tenant-scoped CSV attachment.
          content:
            text/csv:
              schema: {type: string}
        '413':
          description: Narrow the filter/time range and retry.
        '503':
          description: Audit persistence unavailable; no export is released.
        default:
          $ref: '#/components/responses/Error'
  /compliance/grants:
    get:
      summary: List current and historical grants and eligible recipients.
      description: Tenant owner only. Historical unconfirmed grants do not authorize content. recipients contains this tenant's owner/admin users, never unrelated tenants.
      responses:
        '200': {description: grants and recipients arrays.}
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Explicitly authorize content preview or export.
      security:
      - Bearer: []
        CSRF: []
      description: Owner only; the database independently checks authority and records owner confirmation. Preview and export scopes are independent. Requires a nonempty reason and future finite expiry. Reauthorization creates a new immutable grant; it never blesses a historical row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, scope, reason, expires_at]
              properties:
                user_id: {type: integer, format: int64, minimum: 1}
                scope: {type: string, enum: [full_content, export, retention_manage]}
                reason: {type: string, minLength: 1, maxLength: 2000}
                expires_at: {type: string, format: date-time}
      responses:
        '201': {description: grant including owner_confirmed_at.}
        default:
          $ref: '#/components/responses/Error'
  /compliance/grants/{id}/revoke:
    post:
      summary: Revoke a grant without rewriting its original provenance.
      security:
      - Bearer: []
        CSRF: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      description: Owner only. Repeated revocation preserves the first revocation metadata and returns the same revoked grant. Wrong-tenant/missing grant returns 404.
      responses:
        '200': {description: Revoked grant.}
        default:
          $ref: '#/components/responses/Error'
  /billing/document-profile:
    get:
