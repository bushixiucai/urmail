        billing_cycle: *id001
        currency: *id001
        base_amount_cents: *id004
        discount_cents: *id004
        prorated_credit_cents: *id004
        final_amount_cents: *id004
        period_start: *id006
        period_end: *id006
        generated_at: *id006
        expires_at: *id006
        digest: *id001
