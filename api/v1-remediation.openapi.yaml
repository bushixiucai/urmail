                  format: int64
                  minimum: 1
                coupon_code:
                  type: string
                plan_code:
                  type: string
      responses:
        '201':
          description: status=trialing, ends_at and pending onboarding status. Mail remains gated by domain provisioning readiness.
        '409':
          description: Trial already used, domain proof missing, paid entitlement exists, unavailable trial plan or exhausted coupon.
        default:
          $ref: '#/components/responses/Error'
