  /platform/brand-hosts/{hostname}/lifecycle:
    parameters:
    - name: hostname
      in: path
      required: true
      schema:
        type: string
        maxLength: 253
    get:
      operationId: getBrandHostLifecycle
      summary: Inspect a platform-owned brand host and its current certificate verdict
      description: Platform administrators on the canonical platform host only. Certificate null means not observed
        and never means ready. No private key or DNS challenge token is returned.
      security:
      - Bearer: []
      responses:
        '200':
          description: Persisted lifecycle and current public certificate facts
          content:
            application/json:
              schema:
                type: object
                required:
                - host
                - certificate
                properties:
                  host:
                    type: object
                    additionalProperties: true
                  certificate:
                    nullable: true
                    type: object
                    properties:
                      trusted:
                        type: boolean
                      reason:
                        type: string
                      expires_at:
                        type: string
                        format: date-time
        '401':
          description: Missing
          expired: null
          or origin-mismatched session: null
        '403':
          description: Platform administration unavailable on brand hosts or caller unauthorized
        '404':
          description: Host binding does not exist
    post:
      operationId: advanceBrandHostLifecycle
      summary: Create DNS proof, verify actual TXT, or issue and activate a verified brand host
      description: Canonical-host platform administrator and current CSRF token required. Explicit confirm is mandatory.
        challenge returns the raw disposable token once; only its digest is stored. verify accepts no token and observes
        DNS itself, then atomically fences the binding, digest and expiry. activate fences brand ID and verification
        generation, issues a trusted certificate through the privileged agent and applies configuration before marking
        active. On timeout inspect GET before retrying; an issued certificate can be retained while routing remains
        pending. Existing bindings cannot be overwritten; revocation immediately rejects stale routing and old proof
        cannot be reused.
      security:
      - Bearer: []
        CSRF: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - action
              - confirm
              properties:
                action:
                  type: string
                  enum:
                  - challenge
                  - verify
                  - activate
                confirm:
                  type: boolean
                  enum:
                  - true
      responses:
        '200':
