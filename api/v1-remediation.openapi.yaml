    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    get:
      summary: Read up to 100 redacted TLS report summaries
      description: Tenant owner/admin only, with tenant predicates and FORCE RLS. Contains period_start/end, successful/failed
        counts, bounded failure-type totals, received time and source_verified=false. Raw source IPs, free text, organization/contact
        strings and report IDs are never retained or returned. HTTPS submissions do not prove reporter identity and
        cannot authorize enforcement.
      security:
      - Bearer: []
        CSRF: []
      responses:
        '200':
          description: Successful result.
        default:
          $ref: '#/components/responses/Error'
  /tls-reports/{fqdn}:
    parameters:
    - name: fqdn
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Receive bounded RFC 8460 HTTPS reports
      description: Anonymous intake only for an enabled verified domain resolved by the server. Supports JSON and
        gzip JSON with 1 MiB wire/4 MiB expansion, bounded JSON depth/tokens, at most 100 policies and 200 failure
        details per policy, counts <= 1e9 and at most 2000 retained summaries per domain per day. Source organization/report
        identity is hashed; exact replay returns 202, conflicting reuse returns 409. Input never creates authenticated
        provider evidence. Separate IP/domain rate limits and a four-request concurrency cap protect the mail runtime.
      security: []
      responses:
        '202':
          description: Successful result.
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/tlsrpt+json:
            schema:
              type: object
          application/tlsrpt+gzip:
            schema:
              type: string
              format: binary
