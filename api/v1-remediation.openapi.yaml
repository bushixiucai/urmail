    post:
      summary: Authorize the exact current cloud target or revoke all cloud export.
      description: Tenant owner/admin only. Provider configuration by the platform never grants tenant consent. Consent pins a monotonic configuration digest and content scope hash; changing provider, endpoint, model or scope invalidates it, including changing back. Revocation enforces independent tenant local-only. Current in-flight authorized requests cannot be physically recalled.
      security:
      - Bearer: []
        CSRF: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allow_cloud]
              properties:
                configuration_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
                scope_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
                allow_cloud: {type: boolean}
                confirmed: {type: boolean, description: Must be explicitly true to allow cloud content export.}
      responses:
        '204': {description: 'Exact target authorized, or cloud export revoked.'}
        '409': {description: Configuration changed; reload and review the new target.}
        default: {$ref: '#/components/responses/Error'}
