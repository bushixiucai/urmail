              - zh-CN
              - en
              nullable: true
            mailbox_default_quota_bytes:
              type: integer
              format: int64
              minimum: 1
              nullable: true
            theme:
              type: object
              properties:
                primary:
                  type: string
                  pattern: ^#[0-9a-fA-F]{6}$
              additionalProperties: false
              nullable: true
              required:
              - primary
          additionalProperties: false
      required:
      - settings
    Settings:
      type: object
      properties:
        settings:
          type: object
          additionalProperties: true
      required:
      - settings
    Usage:
      type: object
      properties:
        domains_used: *id004
        domains_limit: *id004
        mailboxes_used: *id004
        mailboxes_limit: *id004
        storage_bytes_limit: *id004
        storage_bytes_allocated: *id004
        storage_bytes_used:
          type: integer
          format: int64
          nullable: true
        storage_measured_at:
          type: string
          format: date-time
          nullable: true
        storage_error:
          type: string
          nullable: true
        storage_status:
          type: string
          enum:
          - measured
          - unknown
      required:
      - domains_used
      - domains_limit
      - mailboxes_used
      - mailboxes_limit
      - storage_bytes_limit
      - storage_bytes_allocated
      - storage_bytes_used
      - storage_measured_at
      - storage_error
      - storage_status
    TenantCurrent:
      type: object
      properties:
        tenant:
          type: object
          properties:
            id: *id004
            name: *id001
            slug: *id001
            status: *id001
            created_at: *id006
        settings:
          type: object
          additionalProperties: true
        theme:
          type: object
          nullable: true
          additionalProperties: true
        usage:
