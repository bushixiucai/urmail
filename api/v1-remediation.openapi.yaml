      description: Tenant owner, admin or billing; own tenant only. Tax ID, bank account, phone and email are masked. Existing document snapshots are never changed by this resource.
      responses:
        '200': {description: Profile object and configured flag.}
        default: {$ref: '#/components/responses/Error'}
    put:
      summary: Patch the identity captured only by future confirmed quotes.
      description: Tenant owner, admin or billing; own tenant only. Omitted party fields retain existing values; an explicit empty string clears a field. Only the platform seller profile may configure tax. Tax rates use integer basis points and split the existing tax-inclusive total without increasing it. This does not enable formal tax invoicing.
      security:
      - Bearer: []
        CSRF: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                party:
                  type: object
                  additionalProperties: {type: string}
                locale: {type: string, enum: [en, zh-CN]}
                tax:
                  type: object
                  properties:
                    configured: {type: boolean}
                    included_in_total: {type: boolean, enum: [true]}
                    rate_basis_points: {type: integer, minimum: 0, maximum: 10000}
      responses:
        '204': {description: Updated future profile.}
        default: {$ref: '#/components/responses/Error'}
  /platform/billing-document-profile:
    get:
      summary: Read a masked future commercial statement profile.
      description: Platform administrator only; platform transaction required on writes. Tax ID, bank account, phone and email are masked. Existing document snapshots are never changed by this resource.
      responses:
        '200': {description: Profile object and configured flag.}
