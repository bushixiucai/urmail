    put:
      summary: Patch the identity captured only by future confirmed quotes.
      description: Platform administrator only; platform transaction required on writes. Omitted party fields retain existing values; an explicit empty string clears a field. Only the platform seller profile may configure tax. Tax rates use integer basis points and split the existing tax-inclusive total without increasing it. This does not enable formal tax invoicing.
      security:
      - Bearer: []
        CSRF: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
