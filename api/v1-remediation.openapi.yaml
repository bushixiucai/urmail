            schema:
              type: object
              additionalProperties: false
              required:
              - action
              - confirm
              properties:
                action:
                  type: string
                  enum:
                  - prepare
                  - enable
                  - rotate
                  - retire
                  - rollback
                  - disable-check
                  - disable
                  - secondary-configure
                  - secondary-prepare
                  - backup-manifest
                confirm:
                  type: boolean
                  enum:
                  - true
                secondary:
                  type: object
                  additionalProperties: false
                  required:
                  - hostname
                  - address
                  - primary_address
                  - tsig_key_name
                  properties:
                    hostname:
                      type: string
                      maxLength: 253
                    address:
                      type: string
                      description: Concrete secondary IP address.
                    primary_address:
                      type: string
                      description: Concrete primary IP address.
                    tsig_key_name:
                      type: string
                      maxLength: 128
                      pattern: ^[A-Za-z0-9_.-]+$
      responses:
        '200':
          description: Named operation accepted; configuration convergence and live readiness are separate facts.
        '400':
          description: Unsupported action
          missing confirmation or unknown fields.: null
        '403':
          description: Missing CSRF or current owner/admin role.
        '404':
          description: Foreign or nonexistent domain.
        '409':
          description: Role/ownership changed
          ? delegation/cache preconditions failed or agent result requires review. Refresh live state before retrying;
            do not blindly repeat a mutation.
          : null
        '503':
          description: Root agent unavailable or invalid response.
  /compliance/recalls/preview:
    post:
      operationId: previewLocalRecall
      summary: Inventory and persist an actor-bound review of local mailbox copies
      description: Requires the current tenant owner or administrator and the session CSRF token. No message is deleted.
        The bounded agent resolves mailbox identities from the archive entry and verifies current role, holds and
        original digest. Include-related inventories at most 20 archived targets and 100 local copies. Each selectable
        target gets an expiring token and canonical digest bound to tenant, actor, archive source, hold facts, mailbox
        GUID, UIDVALIDITY, UID and immutable message GUID. Internal message GUIDs are not caller inputs. Remote or
        held targets are returned with a refusal reason and no selectable recall. A new preview never executes a prior
        confirmation automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - archive_entry_id
              properties:
                archive_entry_id:
                  type: integer
                  format: int64
                  minimum: 1
                include_related:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Inventory only; explicit selection and confirmation are still required
          content:
            application/json:
              schema:
                type: object
                required:
                - targets
                - scope
                - remote_recall_guaranteed
                properties:
                  scope:
                    type: string
                    enum:
                    - local_mailbox
                  remote_recall_guaranteed:
                    type: boolean
                    enum:
                    - false
                  targets:
                    type: array
                    maxItems: 20
                    items:
                      type: object
                      required:
                      - entry_id
                      - address
                      - reason
                      - copies
                      - recall
                      properties:
                        entry_id:
                          type: integer
                          format: int64
                        address:
                          type: string
                          nullable: true
                        reason:
                          type: string
                          description: Empty for a selectable preview; otherwise a typed refusal or existing-intent
                            state
                        copies:
                          type: array
                          maxItems: 100
                          items:
                            type: object
                            required:
                            - key
                            - folder
                            - uid
                            - uid_validity
                            properties:
                              key:
                                type: string
                                description: Opaque exact-copy selection handle within this preview
                              folder:
                                type: string
                              uid:
                                type: integer
                                minimum: 1
                                maximum: 4294967295
                              uid_validity:
                                type: integer
                                minimum: 1
                                maximum: 4294967295
                        recall:
                          type: object
                          nullable: true
                          description: Same recall DTO returned by GET. Non-null previews include id, status, preview_token,
                            preview_digest, preview_expires_at, preview_actor_id, attempt_epoch, selected_copy_keys,
                            local_result.items and result_history. Tokens/digests alone never authorize a different
                            actor or source.
        '400':
          description: Invalid bounded request or unknown fields
        '401':
          description: Authentication required
        '403':
          description: Current role or CSRF authority refused
        '404':
          description: Source not visible in the current tenant
        '409':
          description: Review changed or could not be safely persisted; preview again
        '422':
          description: Bounded target or copy limit exceeded; narrow the scope
        '503':
          description: Local inventory or database unavailable; nothing was deleted
  /mailbox/scheduled-sends/{id}/repair-sent-copy:
    post:
      operationId: repairScheduledSentCopy
      tags:
      - Mailbox
      summary: Repair an already accepted scheduled message's Sent copy
      description: Uses the current mailbox bearer session and its fresh IMAP credential. This operation never submits
        SMTP. The task must belong to this exact tenant and mailbox. Pending, unknown and restored held copies are
        claimed with a bounded lease and claim-token fencing. A prior APPEND is reconciled by Message-ID plus exact
        raw SHA256 before another APPEND is considered. Search failure or an incomplete candidate set keeps the copy
        pending. A completed copy is idempotent. The accepted SMTP timestamp is preserved; temporary service-only
        raw and sealed credentials are removed on success. Restored held tasks require this explicit owner action
        after quarantine release.
      security:
      - MailboxBearer: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Copy verified or saved; item.sent_copy_state is complete
          content:
            application/json:
              schema:
                type: object
                required:
                - item
                properties:
                  item:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                      status:
                        type: string
                        enum:
                        - sent
                      sent_copy_state:
                        type: string
                        enum:
                        - complete
                      sent_at:
                        type: string
                        format: date-time
        '401':
          description: Invalid or revoked mailbox session
        '404':
          description: No task belongs to this tenant and mailbox
        '409':
          description: SENT_COPY_PENDING; copy lease busy
          reconciliation incomplete: null
          restore quarantine active or IMAP APPEND unconfirmed. Never resend SMTP.: null
        '502':
          description: IMAP connection or authentication unavailable
        '503':
          description: Webmail or database unavailable
  /domains/{id}/transport-security:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    get:
      summary: Read a domain transport publication
      description: Tenant owner/admin only. Returns enabled/version/mode/publication ID, exact MX, max_age, HTTPS
        policy body, TLS report URI, required DNS records, cache_safe_after and four public-observation booleans.
        New domains return enabled=false/version=0/testing. DANE remains explicitly disabled.
      security:
      - Bearer: []
        CSRF: []
      responses:
        '200':
          description: Successful result.
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Publish an explicitly confirmed transport policy
      description: Tenant owner/admin and CSRF required. First publication must be testing. Enforce requires one prior
        max_age observation period and matching successful DNS ID, receiving MX, HTTPS certificate/body and SMTP STARTTLS
        evidence less than one hour old. Source/target hosts come only from the verified domain and operator configuration.
        Version CAS rejects stale forms. Overlapping longer cache deadlines are retained; mode=none must drain them
        before receiving-host changes or disable. Recognized dedicated transport records can be updated; unrelated/duplicate
        DNS records remain conflicts. External provider writes still require a separate reviewed DNS plan.
      security:
      - Bearer: []
        CSRF: []
      responses:
        '200':
          description: Successful result.
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                  - testing
                  - enforce
                  - none
                max_age:
                  type: integer
                  minimum: 300
                  maximum: 604800
                version:
                  type: integer
                  format: int64
                  minimum: 0
                confirm:
                  type: boolean
                  enum:
                  - true
              required:
              - mode
              - max_age
              - version
              - confirm
    delete:
      summary: Disable publication after cache drain
      description: Requires current version and explicit confirmation. Only mode=none after cache_safe_after can be
        disabled. A shorter new max_age does not erase an older cache deadline. Returns 409 while unsafe.
      security:
      - Bearer: []
        CSRF: []
      responses:
        '204':
          description: Successful result.
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
                  format: int64
                  minimum: 1
                confirm:
                  type: boolean
                  enum:
                  - true
              required:
              - version
              - confirm
  /domains/{id}/transport-security/observe:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    post:
      summary: Probe public DNS and TLS without holding the tenant transaction
      description: No caller-supplied URL or host is used. DNS, strict HTTPS policy and SMTP STARTTLS probes use fixed
        derived destinations, reject mixed/private/special-use DNS answers and redirects, and never send mail. Result
        persistence uses a fresh tenant/user transaction and version CAS. status is verified or failed; HTTP 200 alone
        is not verification.
      security:
      - Bearer: []
        CSRF: []
      responses:
        '200':
          description: Successful result.
        default:
          $ref: '#/components/responses/Error'
