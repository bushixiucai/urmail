          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  enum:
                  - contact_enrolled
                event_key:
                  type: string
                  pattern: ^[A-Za-z0-9_.:-]{8,128}$
                list_id:
                  type: integer
                  format: int64
                  minimum: 1
              required:
              - source
              - event_key
              - list_id
