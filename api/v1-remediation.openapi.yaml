  /ai/consent:
    post:
      summary: Authorize the exact current cloud target or revoke all cloud export.
      description: Tenant owner/admin only. Provider configuration by the platform never grants tenant consent. Consent pins a monotonic configuration digest and content scope hash; changing provider, endpoint, model or scope invalidates it, including changing back. Revocation enforces independent tenant local-only. Current in-flight authorized requests cannot be physically recalled.
      security:
      - Bearer: []
        CSRF: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allow_cloud]
              properties:
                configuration_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
                scope_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
                allow_cloud: {type: boolean}
                confirmed: {type: boolean, description: Must be explicitly true to allow cloud content export.}
      responses:
        '204': {description: Exact target authorized, or cloud export revoked.}
        '409': {description: Configuration changed; reload and review the new target.}
        default: {$ref: '#/components/responses/Error'}
  /mailbox/sieve/session:
    get:
      summary: Read the scoped mailbox rules and their optimistic version.
      description: Dedicated HttpOnly mailbox cookie only, never a panel token. Response includes mailbox, rules, version (SHA256 of persisted desired source), state, CSRF and expiry.
      security: []
      responses:
        '200': {description: Current rules and expected version for the next confirmed save.}
        default: {$ref: '#/components/responses/Error'}
  /mailbox/sieve/rules:
    put:
      summary: Confirm structured rule replacement against the last viewed version.
      description: Dedicated mailbox cookie and X-Urmail-Sieve-CSRF required. No tenant/mailbox selector. Stale versions return 409 without changing desired or active rules. Root agent additionally validates the exact persisted desired digest before atomic activation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules, confirmed, expected_version]
              properties:
                rules: {type: object}
                confirmed: {type: boolean, enum: [true]}
                expected_version: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        '200': {description: Persisted rules, new version and activation state.}
        '409': {description: Another editor changed the rules; reload and review.}
        default: {$ref: '#/components/responses/Error'}
  /platform/tenants/{id}/ai/configuration:
    parameters:
    - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      summary: Read safe provider metadata and the independent tenant consent policy.
      description: Platform administrator only. Never returns encrypted or plaintext credentials. An unconfigured tenant still returns cloud_endpoints and local-only consent defaults.
      security: [{Bearer: []}]
      responses:
        '200': {description: configured, configuration, cloud_endpoints and tenant_consent.}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: Configure a platform provider without authorizing tenant cloud export.
      description: Platform administrator and CSRF required. Changing provider, endpoint, model or content scope invalidates existing consent. Tenant local-only cannot be overridden. Monetary rates are micros per million tokens; integers cannot exceed 9007199254740991. Credential input is write-only. No billable model call is made.
      security: [{Bearer: [], CSRF: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, endpoint, model, cost_currency]
              properties:
                provider: {type: string, enum: [openai, azure]}
                endpoint: {type: string}
                model: {type: string}
                api_key: {type: string, writeOnly: true}
                enabled: {type: boolean}
                input_micros_per_million: {type: integer, minimum: 0, maximum: 9007199254740991}
                output_micros_per_million: {type: integer, minimum: 0, maximum: 9007199254740991}
                cost_currency: {type: string, enum: [CNY, USD]}
      responses:
        '204': {description: Configuration saved; separate tenant authorization remains required.}
        default: {$ref: '#/components/responses/Error'}
  /platform/tenants/{id}/ai/usage:
    parameters:
    - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      summary: List up to 100 oldest unfinished AI accounting records.
      description: Platform administrator only. Metadata excludes prompts, model results and request keys. Decimal strings actual_tokens_exact/reserved_tokens_exact preserve full integer precision; unsafe numeric token values are null. Reserved records expire to uncertain before manual reconciliation, even without another mailbox request.
      security: [{Bearer: []}]
      responses:
        '200': {description: requests array with reserved/uncertain accounting metadata.}
        default: {$ref: '#/components/responses/Error'}
  /platform/tenants/{id}/ai/health:
    parameters:
    - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
    post:
      summary: Run an authorized metadata-only provider health check.
      description: Platform administrator, CSRF and 5/min rate limit. Respects tenant local-only and cloud consent; never generates billable model content. Disabled, unconsented or invalid endpoints are refused.
      security: [{Bearer: [], CSRF: []}]
      responses:
        '200': {description: Safe provider health metadata.}
        default: {$ref: '#/components/responses/Error'}
  /platform/tenants/{id}/ai/usage/{request_id}/resolve:
    parameters:
    - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
    - {name: request_id, in: path, required: true, schema: {type: integer, minimum: 1}}
    post:
      summary: Reconcile uncertain AI usage with observed evidence and audit.
      description: Platform administrator and CSRF. Acquires the tenant budget lock and expires old reservations before resolution. Fresh reserved/completed records cannot be overwritten. Values must be observed, not assumed zero; repeated incompatible decisions return conflict.
      security: [{Bearer: [], CSRF: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, tokens, cost_micros, cost_currency, reason]
              properties:
                status: {type: string, enum: [resolved, released]}
                tokens: {type: integer, minimum: 0, maximum: 9007199254740991}
                cost_micros: {type: integer, minimum: 0, maximum: 9007199254740991}
                cost_currency: {type: string, enum: [CNY, USD]}
                reason: {type: string, minLength: 10, maxLength: 2000}
      responses:
        '200': {description: Observed accounting persisted with an audit record.}
        '409': {description: Not uncertain, stale or incompatible resolution.}
        default: {$ref: '#/components/responses/Error'}
  /platform/tenants/{id}/billing-calendar:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    get:
      tags: [M5-M7 managed operations]
      summary: Read verified billing calendar and legacy review state
      description: >-
        Platform staff only. Existing calendars are read-only. Missing legacy
        calendar facts never revoke existing paid entitlements; review is required
        before a new quote. Current business timezone is displayed as a present
        setting, never inferred as the original paid timezone. No provider calls.
      security: [{Bearer: []}]
      responses:
        '200':
          description: Verified facts or explicit missing-calendar state.
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id, calendar, review_required, current_business_timezone]
                properties:
                  tenant_id: {type: integer, format: int64}
                  review_required: {type: boolean}
                  current_business_timezone: {type: string}
                  calendar:
                    type: object
                    nullable: true
                    properties:
                      timezone: {type: string}
                      first_paid_at: {type: string, format: date-time}
                      anchor_at: {type: string, format: date-time}
                      version: {type: integer, format: int64}
                      source: {type: string, enum: [first_paid, manual_legacy, reactivation]}
        default: {$ref: '#/components/responses/Error'}
    put:
      tags: [M5-M7 managed operations]
      summary: Verify a missing legacy paid calendar exactly once
      description: >-
        Platform staff with CSRF only. Requires a missing calendar and protected
        paid history under the tenant billing lock. Initializes source=manual_legacy,
        anchor_at=first_paid_at and server-owned staff identity. A reason and valid
        past/current RFC3339 timestamp with an explicit offset are required. Current
        settings and last short-month boundaries are not historical proof. Calendar
        insertion and mandatory successful audit commit atomically; audit failure
        rolls back both. Existing calendar returns 409 and cannot overwrite its first
        timezone or first paid instant. New customers without legacy paid history
        return 409; their first completed commercial purchase establishes the calendar.
        This never changes paid terms, invoices, subscriptions or external funds.
      security: [{Bearer: [], CSRF: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timezone, first_paid_at, reason]
              properties:
                timezone: {type: string, maxLength: 64, example: Asia/Shanghai}
                first_paid_at: {type: string, format: date-time, example: '2024-01-31T09:00:00+08:00'}
                reason: {type: string, minLength: 20, maxLength: 1000, writeOnly: true}
      responses:
        '200': {description: Verified state, with the same response shape as GET.}
        '400': {description: Invalid timezone/timestamp/reason.}
        '401': {description: Authentication required.}
        '403': {description: Platform staff authorization or CSRF rejected.}
        '404': {description: Tenant not found.}
        '409': {description: Calendar already exists or no legacy paid history requires review.}
        '500': {description: Mandatory audit or transaction failed; no calendar committed.}
        default: {$ref: '#/components/responses/Error'}

components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      description: Active panel-session token. A legacy-only session is rejected.
    CSRF:
      type: apiKey
      in: header
      name: X-CSRF-Token
  responses:
    Error:
      description: 400 invalid input; 401 unauthenticated; 403 role/scope/CSRF/factor denial; 404 unknown or cross-tenant
        object; 409 conflict; 429 rate limited; 5xx infrastructure/provider failure. The HTTP status and machine
        code are preserved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: *id001
            message: *id001
            params:
              type: object
              additionalProperties: true
            details: {}
          required:
          - code
      required:
      - error
    Status:
      type: object
      properties:
        status: *id001
      required:
      - status
    PublicBrand:
      type: object
      properties:
        slug: *id001
        name: *id001
        theme:
          type: object
          additionalProperties: *id001
        logo_url:
          type: string
          nullable: true
        favicon_url:
          type: string
          nullable: true
        primary_color:
          type: string
          nullable: true
      required:
      - slug
      - name
      - theme
    Credential:
      type: object
      properties:
        id: *id004
        name: *id001
        scopes:
          type: array
          items: *id005
        expires_at: &id006
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at: *id006
      required:
      - id
      - name
      - scopes
      - expires_at
    FreshFactor:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Fresh TOTP or an unused recovery code.
      required:
      - code
    LegacySession:
      type: object
      properties:
        token: *id001
        csrf_token: *id001
        expires_at: *id006
      required:
      - token
      - csrf_token
      - expires_at
    SettingsPatch:
      type: object
      properties:
        settings:
          type: object
          properties:
            locale:
              type: string
              enum:
              - zh-CN
              - en
              nullable: true
            mailbox_default_quota_bytes:
              type: integer
              format: int64
              minimum: 1
              nullable: true
            theme:
              type: object
              properties:
                primary:
                  type: string
                  pattern: ^#[0-9a-fA-F]{6}$
              additionalProperties: false
              nullable: true
              required:
              - primary
          additionalProperties: false
      required:
      - settings
    Settings:
      type: object
      properties:
        settings:
          type: object
          additionalProperties: true
      required:
      - settings
    Usage:
      type: object
      properties:
        domains_used: *id004
        domains_limit: *id004
        mailboxes_used: *id004
        mailboxes_limit: *id004
        storage_bytes_limit: *id004
        storage_bytes_allocated: *id004
        storage_bytes_used:
          type: integer
          format: int64
          nullable: true
        storage_measured_at:
          type: string
          format: date-time
          nullable: true
        storage_error:
          type: string
          nullable: true
        storage_status:
          type: string
          enum:
          - measured
          - unknown
      required:
      - domains_used
      - domains_limit
      - mailboxes_used
      - mailboxes_limit
      - storage_bytes_limit
      - storage_bytes_allocated
      - storage_bytes_used
      - storage_measured_at
      - storage_error
      - storage_status
    TenantCurrent:
      type: object
      properties:
        tenant:
          type: object
          properties:
            id: *id004
            name: *id001
            slug: *id001
            status: *id001
            created_at: *id006
        settings:
          type: object
          additionalProperties: true
        theme:
          type: object
          nullable: true
          additionalProperties: true
        usage:
          $ref: '#/components/schemas/Usage'
        subscription:
          type: object
          properties:
            plan_code: *id001
            plan_name:
              type: object
              additionalProperties: *id001
            status: *id001
      required:
      - tenant
      - settings
      - theme
      - usage
      - subscription
    MarketingSuppressionRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    MarketingSuppression:
      type: object
      required: [id, tenant_id, email, reason, created_at]
      properties:
        id: *id004
        tenant_id: *id004
        email:
          type: string
          format: email
        reason:
          type: string
          enum: [unsubscribe, bounce, complaint, manual]
        created_at: *id006
    BrandHost:
      type: object
      properties:
        hostname: *id001
        brand_id: *id004
        created_at: *id006
      required:
      - hostname
      - brand_id
    BrandInput:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
        name:
          type: string
          minLength: 1
        theme:
          type: object
          additionalProperties: *id001
          description: Only primary, secondary, background, foreground, accent, ring and radius; bounded color/radius
            values.
        logo_url: *id001
        favicon_url: *id001
        primary_color: *id001
        status:
          type: string
          enum:
          - active
          - disabled
          default: active
      required:
      - slug
      - name
    ManagedBrand:
      allOf:
      - $ref: '#/components/schemas/PublicBrand'
      - type: object
        properties:
          id: *id004
          status:
            type: string
            enum:
            - active
            - disabled
          created_at: *id006
        required:
        - id
        - status
    Alias:
      type: object
      properties:
        id: *id004
        domain_id: *id004
        domain_fqdn: *id001
        local_part: *id001
        target: *id001
        kind:
          type: string
          enum:
          - alias
          - catchall
          - forward
        active:
          type: boolean
        created_at: *id006
    Plan:
      type: object
      properties:
        code: *id001
        name:
          type: object
