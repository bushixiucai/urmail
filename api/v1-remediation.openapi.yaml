  /platform/tenants/{id}/billing-calendar:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    get:
      tags: [M5-M7 managed operations]
      summary: Read verified billing calendar and legacy review state
      description: >-
        Platform staff only. Existing calendars are read-only. Missing legacy
        calendar facts never revoke existing paid entitlements; review is required
        before a new quote. Current business timezone is displayed as a present
        setting, never inferred as the original paid timezone. No provider calls.
      security: [{Bearer: []}]
      responses:
        '200':
          description: Verified facts or explicit missing-calendar state.
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id, calendar, review_required, current_business_timezone]
                properties:
                  tenant_id: {type: integer, format: int64}
                  review_required: {type: boolean}
                  current_business_timezone: {type: string}
                  calendar:
                    type: object
                    nullable: true
                    properties:
                      timezone: {type: string}
                      first_paid_at: {type: string, format: date-time}
                      anchor_at: {type: string, format: date-time}
                      version: {type: integer, format: int64}
                      source: {type: string, enum: [first_paid, manual_legacy, reactivation]}
        default: {$ref: '#/components/responses/Error'}
    put:
      tags: [M5-M7 managed operations]
      summary: Verify a missing legacy paid calendar exactly once
      description: >-
        Platform staff with CSRF only. Requires a missing calendar and protected
        paid history under the tenant billing lock. Initializes source=manual_legacy,
        anchor_at=first_paid_at and server-owned staff identity. A reason and valid
        past/current RFC3339 timestamp with an explicit offset are required. Current
        settings and last short-month boundaries are not historical proof. Calendar
        insertion and mandatory successful audit commit atomically; audit failure
        rolls back both. Existing calendar returns 409 and cannot overwrite its first
        timezone or first paid instant. New customers without legacy paid history
        return 409; their first completed commercial purchase establishes the calendar.
        This never changes paid terms, invoices, subscriptions or external funds.
      security: [{Bearer: [], CSRF: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timezone, first_paid_at, reason]
              properties:
                timezone: {type: string, maxLength: 64, example: Asia/Shanghai}
                first_paid_at: {type: string, format: date-time, example: '2024-01-31T09:00:00+08:00'}
                reason: {type: string, minLength: 20, maxLength: 1000, writeOnly: true}
      responses:
        '200': {description: 'Verified state, with the same response shape as GET.'}
        '400': {description: Invalid timezone/timestamp/reason.}
        '401': {description: Authentication required.}
        '403': {description: Platform staff authorization or CSRF rejected.}
        '404': {description: Tenant not found.}
        '409': {description: Calendar already exists or no legacy paid history requires review.}
        '500': {description: Mandatory audit or transaction failed; no calendar committed.}
        default: {$ref: '#/components/responses/Error'}
  /roundcube/bridge:
    post:
      tags: [M8 mailbox continuity]
      summary: Change the independently authenticated mailbox password
      deprecated: true
      description: >-
        DEPRECATED — Roundcube packaging is retired and never activates by default
        (URMAIL_ROUNDCUBE_ENABLED defaults to false). When disabled the route is not
        mounted and clients receive 404. Retained only for historical contract documentation.
        Documents the change_password operation; other existing bridge actions remain unchanged.
        Panel Bearer identity never authorizes this operation. Requires the Roundcube service
        HMAC over POST, exact path, timestamp, nonce and raw JSON body, plus an independently
        authenticated mailbox session and fresh current-password proof. The exact address must
        belong to that session. Service login signing alone cannot bypass current-password proof.
        Session resolution locks the mailbox; ten recent mailbox failures in fifteen minutes
        block further verification. Resolved rejections and their nonce consumption are audited
        in that transaction. Password hash/version CAS, all bridge session/ticket revocations
        and successful audit commit together. No password, hash or token is returned or logged.
        Old IMAP disconnection is durable asynchronous work, retried by the privileged agent;
        pending does not claim synchronous disconnection. Current Roundcube session is destroyed
        and requires login again. An uncertain transport result also forces login to verify the
        outcome; it does not automatically resubmit. Existing remembered sessions using the old
        password cannot reauthenticate; unknown third-party remember-token deletion is not claimed.
      security: []
      parameters:
      - {name: X-Urmail-Timestamp, in: header, required: true, schema: {type: string}}
      - {name: X-Urmail-Nonce, in: header, required: true, schema: {type: string}}
      - {name: X-Urmail-Signature, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, address, session, old_password, new_password]
              properties:
                action: {type: string, enum: [change_password]}
                address: {type: string, format: email, maxLength: 320}
                session: {type: string, writeOnly: true}
                old_password:
                  type: string
                  writeOnly: true
                  minLength: 1
                  maxLength: 4096
                  description: Current mailbox password; at most 4096 UTF-8 bytes. Never normalized.
                new_password:
                  type: string
                  writeOnly: true
                  minLength: 12
                  maxLength: 256
                  description: At least 12 Unicode code points, at most 256 UTF-8 bytes, no control characters, different from current password. Never trimmed or normalized.
      responses:
        '200':
          description: Password committed; reauthentication required and IMAP disconnection pending.
          content:
            application/json:
              schema:
                type: object
                required: [changed, reauthentication_required, imap_revocation]
                properties:
                  changed: {type: boolean, enum: [true]}
                  reauthentication_required: {type: boolean, enum: [true]}
                  imap_revocation: {type: string, enum: [pending]}
        '400': {description: Invalid request or MAILBOX_PASSWORD_POLICY, $ref: '#/components/responses/Error'}
        '401': {description: Missing or invalid service HMAC, $ref: '#/components/responses/Error'}
        '403': {description: Mailbox session/address or current-password proof rejected, $ref: '#/components/responses/Error'}
        '409': {description: Nonce replay or concurrent password change, $ref: '#/components/responses/Error'}
        '429': {description: MAILBOX_PASSWORD_RATE_LIMITED, $ref: '#/components/responses/Error'}
        '503': {description: Bridge, database or mandatory audit unavailable; mutation not acknowledged, $ref: '#/components/responses/Error'}
  /mailbox/status:
    get:
      tags:
      - Native mailbox
      summary: Report whether native webmail is enabled
      security: []
      responses:
        '200':
          description: Feature status, not proof that mail protocols are ready.
          content:
            application/json:
              schema:
                type: object
                required:
                - native
                properties:
                  native:
                    type: boolean
                  mail_host:
                    type: string
                    description: Operator-configured mail hostname for native client setup.
  /mailbox/session:
    post:
      tags: [Native mailbox]
      summary: Authenticate an independent mailbox identity
      security: []
      description: Mailbox password only. A panel login never grants mailbox content access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password, maxLength: 4096, description: At most 4096 UTF-8 bytes; historical credentials are not trimmed or normalized.}
      responses:
        '200':
          description: Process-bound native session. Keep tokens in private client storage.
          content:
            application/json:
              schema:
                type: object
                required: [token, address, expires_at]
                properties:
                  token: {type: string}
                  address: {type: string, format: email}
                  expires_at: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Native mailbox]
      summary: Revoke this mailbox session
      security: [{MailboxBearer: []}]
      responses:
        '200': {description: Session revoked and process-local credential cleared.}
        '401': {$ref: '#/components/responses/Error'}
  /mailbox/folders/{name}/messages:
    get:
      tags: [Native mailbox]
      summary: List or search one mailbox folder
      security: [{MailboxBearer: []}]
      parameters:
      - {name: name, in: path, required: true, schema: {type: string}, description: URL-safe encoded folder name returned by the folders endpoint.}
      - {name: limit, in: query, schema: {type: integer, default: 50, minimum: 1, maximum: 100}}
      - {name: offset, in: query, schema: {type: integer, default: 0, minimum: 0}}
      - name: q
        in: query
        schema: {type: string}
        description: 'Optional IMAP search: subject:, from:, text:, is:unseen, or bare text matching subject/from. Invalid search returns INVALID_SEARCH_QUERY.'
      responses:
        '200': {description: 'Newest-first messages and total hit count, limit, offset and q. UID values are scoped to this folder and its UIDVALIDITY.'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /mailbox/folders/{name}/messages/{uid}:
    get:
      tags: [Native mailbox]
      summary: Read one independently authenticated mailbox message
      security: [{MailboxBearer: []}]
      parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
      - {name: uid, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 4294967295}}
      responses:
        '200': {description: 'Message includes uid_validity, To/Cc/Bcc, plain/HTML bodies and attachment metadata. Untrusted HTML requires isolated rendering with remote resources blocked.'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /mailbox/folders/{name}/messages/{uid}/attachments/{part_id}:
    get:
      tags: [Native mailbox]
      summary: Download a complete decoded MIME attachment
      security: [{MailboxBearer: []}]
      parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
      - {name: uid, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 4294967295}}
      - {name: part_id, in: path, required: true, schema: {type: string, pattern: '^[0-9]+(\.[0-9]+)*$'}}
      responses:
        '200':
          description: Complete file with attachment disposition, nosniff and no-store. No partial success on truncation. The decoded attachment limit is 16 MiB.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {description: ATTACHMENT_TOO_LARGE, $ref: '#/components/responses/Error'}
        '422': {description: ATTACHMENT_INVALID, $ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /mailbox/send:
    post:
      tags: [Native mailbox]
      summary: Submit a mailbox-authenticated message to local SMTP
      security: [{MailboxBearer: []}]
      description: Uploads are limited to 16 MiB of JSON, 5 MiB per decoded attachment and 10 MiB of decoded attachments in total. SMTP acceptance is not final recipient delivery. An uncertain result must be checked before any resend. Bcc is part of the envelope and is never emitted in SMTP message headers.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NativeMailboxCompose'}
      responses:
        '200': {description: Local SMTP accepted the message. QUIT failure after acceptance does not change this result.}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {description: MAILBOX_SEND_UNCERTAIN. Submission may have succeeded; do not automatically resend., $ref: '#/components/responses/Error'}
        '413': {description: MAILBOX_MESSAGE_TOO_LARGE., $ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /mailbox/drafts:
    put:
      tags: [Native mailbox]
      summary: Save a new draft or replace an explicitly identified draft
      security: [{MailboxBearer: []}]
      description: Content stays in IMAP. Uploads are limited to 16 MiB of JSON and 10 MiB of decoded attachments in total. To replace, include uid and uid_validity from the original message. Missing or changed identity is rejected before append. Preserve Bcc, HTML and every attachment when editing existing drafts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - {$ref: '#/components/schemas/NativeMailboxCompose'}
              - type: object
                properties:
                  uid: {type: integer, minimum: 0, maximum: 4294967295}
                  uid_validity: {type: integer, minimum: 1, maximum: 4294967295}
      responses:
        '200':
          description: Use the new UID for subsequent edits. cleanup_pending means this new draft is saved but an old copy remains; do not append it again.
          content:
            application/json:
              schema:
                type: object
                required: [saved, folder, name_enc, uid, uid_validity, cleanup_pending]
                properties:
                  saved: {type: boolean, enum: [true]}
                  folder: {type: string}
                  name_enc: {type: string}
                  uid: {type: integer, minimum: 1}
                  uid_validity: {type: integer, minimum: 1}
                  cleanup_pending: {type: boolean}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {description: DRAFT_CHANGED or DRAFT_SAVE_UNCERTAIN. Inspect Drafts before attempting another save., $ref: '#/components/responses/Error'}
        '413': {description: MAILBOX_MESSAGE_TOO_LARGE., $ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
    get:
      tags: [Native mailbox]
      summary: List drafts in the resolved IMAP Drafts folder
      security: [{MailboxBearer: []}]
      parameters:
      - {name: limit, in: query, schema: {type: integer, default: 50, minimum: 1, maximum: 100}}
      - {name: offset, in: query, schema: {type: integer, default: 0, minimum: 0}}
      responses:
        '200': {description: 'Draft messages, folder, name_enc, total, limit and offset.'}
        '401': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /mailbox/drafts/{uid}:
    delete:
      tags: [Native mailbox]
      summary: Delete one draft from the authenticated mailbox
      security: [{MailboxBearer: []}]
      parameters:
      - {name: uid, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 4294967295}}
      - {name: uid_validity, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 4294967295}, description: Folder identity from the original draft. Changed identity blocks deletion.}
      responses:
        '200': {description: Draft expunged.}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {description: DRAFT_CHANGED. The original draft identity no longer matches., $ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /mailbox/scheduled-sends:
    post:
      tags: [Native mailbox]
      summary: Schedule a previously saved, identified IMAP draft
      security: [{MailboxBearer: []}]
      description: Same idempotency key and payload returns the original task, including its terminal state. Different payload under that key or another active task for this draft returns conflict. The worker never blindly retries uncertain SMTP submissions. Existing pre-safety tasks and restored active tasks are held for review.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 16, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draft_uid, draft_uidvalidity, send_at]
              properties:
                draft_uid: {type: integer, minimum: 1, maximum: 4294967295}
                draft_uidvalidity: {type: integer, minimum: 1, maximum: 4294967295}
                send_at: {type: string, format: date-time, description: Must be more than 30 seconds in the future for a new task. Retained unchanged across retries.}
      responses:
        '200':
          description: Created or replayed mailbox-scoped task.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeMailboxSchedule'}
        '400': {description: Invalid parameters or missing SCHEDULE_IDEMPOTENCY_REQUIRED., $ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {description: SCHEDULE_CONFLICT or DRAFT_CHANGED., $ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    get:
      tags: [Native mailbox]
      summary: List pending and terminal tasks for this mailbox
      security: [{MailboxBearer: []}]
      parameters:
      - {name: limit, in: query, schema: {type: integer, default: 50, minimum: 1, maximum: 100}}
      - {name: offset, in: query, schema: {type: integer, default: 0, minimum: 0}}
      responses:
        '200':
          description: Newest-first tasks, including failures and review holds. Error values are stable codes, not SMTP transcripts or credentials.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/NativeMailboxSchedule'}}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /mailbox/scheduled-sends/{id}:
    delete:
      tags: [Native mailbox]
      summary: Cancel before SMTP submission begins
      security: [{MailboxBearer: []}]
      description: Cancellation atomically invalidates a preparing worker. Success guarantees that this task will not submit SMTP. After the worker enters submitting, cancellation returns conflict. Replaying an already successful cancellation is safe.
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200': {description: cancelled=true and item. A cancelled task cannot submit mail.}
        '401': {$ref: '#/components/responses/Error'}
        '404': {description: Unknown task or another mailbox/tenant., $ref: '#/components/responses/Error'}
        '409': {description: SCHEDULE_CANNOT_CANCEL. Submission started or task is terminal/on hold., $ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /mailbox/calendars/invitations:
    get:
      tags:
      - Native mailbox calendar
      summary: Preview an invitation from an actual mailbox message
      description: Uses the authenticated mailbox's original MIME message, pinned to folder, UID and nonzero UIDVALIDITY.
        No client-uploaded ICS or Authentication-Results header is trusted as organizer proof. Verified actions require
        matching organizer and recipient identities and a valid full-body DKIM signature (or the server's own bound
        invitation journal). Unverified REQUEST mail may only offer explicit copy_personal, which creates a distinct
        personal event without organizer authority. Stale updates and mismatched attendees cannot modify the existing
        event. A persisted uncertain response disables further sending; refreshing or restarting does not retry SMTP.
      security:
      - MailboxBearer: []
      parameters:
      - name: folder_enc
        in: query
        required: true
        schema:
          type: string
          minLength: 1
        description: URL-safe encoded source folder returned by the mailbox API.
      - name: uid
        in: query
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
      - name: uid_validity
        in: query
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
      responses:
        '200':
          description: Actual source preview and the actions currently permitted.
          content:
            application/json:
              schema:
                type: object
                required:
                - source_digest
                - verification
                - notification_status
                - method
                - uid
                - sequence
                - organizer
                - recipient
                - actions
                properties:
                  source_digest:
                    type: string
                    pattern: ^[0-9a-f]{64}$
                  verification:
                    type: string
                    enum:
                    - verified
                    - unverified
                  verification_reason:
                    type: string
                    description: Bounded reason code; does not contain mail content or DNS responses.
                  notification_status:
                    type: string
                    enum:
                    - none
                    - sent
                    - uncertain
                  method:
                    type: string
                    enum:
                    - REQUEST
                    - REPLY
                    - CANCEL
                  uid:
                    type: string
                    description: iCalendar UID
                    distinct from the source IMAP UID.: null
                  sequence:
                    type: integer
                    minimum: 0
                  organizer:
                    type: string
                    format: email
                  from:
                    type: string
                    format: email
                  recipient:
                    type: string
                    format: email
                  recurrence_id:
                    type: string
                  event:
                    type: object
                    nullable: true
                    description: Parsed bounded event preview; does not confer mutation authority.
                  linked_event:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: integer
                        format: int64
                        minimum: 1
                      version:
                        type: integer
                        format: int64
                        minimum: 1
                      response:
                        type: string
                      sequence:
                        type: integer
                        minimum: 0
                  actions:
                    type: array
                    maxItems: 7
                    items:
                      type: string
                      enum:
                      - accept
                      - decline
                      - tentative
                      - apply_update
                      - apply_cancel
                      - apply_reply
                      - copy_personal
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: Source mail or calendar invitation not found.
          $ref: '#/components/responses/Error'
        '409':
          description: Source UIDVALIDITY or linked event changed.
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Native mailbox calendar
      summary: Explicitly apply a source-bound invitation action
      description: Re-reads the actual authenticated source and revalidates its digest, recipient, organizer proof,
        sequence and current event version. Panel bearer credentials do not grant mailbox access. accept, decline
        and tentative require outbound entitlement and persist an uncertain SMTP intent before submission. Ambiguous
        delivery is never automatically resent, even after refresh or process restart. apply_update, apply_cancel
        and apply_reply only modify the event bound to this organizer/UID; a single-instance cancellation preserves
        its recurring series.
      security:
      - MailboxBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - source
              - source_digest
              - action
              - confirmed
              properties:
                source:
                  type: object
                  required:
                  - folder_enc
                  - uid
                  - uid_validity
                  properties:
                    folder_enc:
                      type: string
                      minLength: 1
                    uid:
                      type: integer
                      format: int64
                      minimum: 1
                      maximum: 4294967295
                    uid_validity:
                      type: integer
                      format: int64
                      minimum: 1
                      maximum: 4294967295
                source_digest:
                  type: string
                  pattern: ^[0-9a-f]{64}$
                action:
                  type: string
                  enum:
                  - accept
                  - decline
                  - tentative
                  - apply_update
                  - apply_cancel
                  - apply_reply
                  - copy_personal
                expected_version:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Current linked event version from preview; zero only when creating a new event.
                confirmed:
                  type: boolean
                  enum:
                  - true
                  description: Explicit action-specific confirmation.
      responses:
        '200':
          description: Applied once, or replay of the same durable completed action.
          content:
            application/json:
              schema:
                type: object
                required:
                - applied
                - event_id
                - notification_status
                properties:
                  applied:
                    type: boolean
                  event_id:
                    type: integer
                    format: int64
                    minimum: 1
                  notification_status:
                    type: string
                    enum:
                    - sent
                    - not_requested
                  sent_copy:
                    type: boolean
                    description: Whether the submitted reply was also saved to Sent.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Changed source/event
          unverified action: null
          or uncertain SMTP intent that must not be resubmitted.: null
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /mailbox/calendars/reminders:
    get:
      tags:
      - Native mailbox calendar
      summary: List the current mailbox's persisted DISPLAY reminders
      description: Returns only this mailbox's due, unacknowledged reminders. Event reminder offsets are configured
        on the event as reminders (up to five integers, each 0..40320). Single-instance overrides inherit the series
        offsets and use the actual overridden occurrence time. DISPLAY reminders never send email, open URLs, play
        audio or request notification permission. Durable event/instance/offset/version deduplication prevents replay
        after restart; restored historical reminders are not re-created as new alerts.
      security:
      - MailboxBearer: []
      responses:
        '200':
          description: Latest bounded pending reminders.
          content:
            application/json:
              schema:
                type: object
                required:
                - reminders
                properties:
                  reminders:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      required:
                      - id
                      - payload
                      - created_at
                      properties:
                        id:
                          type: integer
                          format: int64
                          minimum: 1
                        created_at:
                          type: string
                          format: date-time
                        payload:
                          type: object
                          properties:
                            event_id:
                              type: integer
                              format: int64
                            version:
                              type: integer
                              format: int64
                            uid:
                              type: string
                            summary:
                              type: string
                            starts_at:
                              type: string
                              format: date-time
                            ends_at:
                              type: string
                              format: date-time
                            timezone:
                              type: string
                            recurrence_id:
                              type: string
                            minutes_before:
                              type: integer
                              minimum: 0
                              maximum: 40320
                            fire_at:
                              type: string
                              format: date-time
                            acknowledged:
                              type: boolean
                              enum:
                              - false
        '401':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /mailbox/calendars/reminders/{reminder_id}/ack:
    post:
      tags:
      - Native mailbox calendar
      summary: Acknowledge one owned reminder
      description: Acknowledgment persists across reload and login. The pending item is removed by the client only
        after success. Another mailbox's or tenant's ID is never accepted; acknowledgment does not modify the underlying
        event.
      security:
      - MailboxBearer: []
      parameters:
      - name: reminder_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Owned reminder acknowledged.
          content:
            application/json:
              schema:
                type: object
                required:
                - acknowledged
                properties:
                  acknowledged:
                    type: boolean
                    enum:
                    - true
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /mailbox/calendars/events/{id}/reply:
    post:
      tags:
      - Native mailbox calendar
      summary: Refuse unsigned client-supplied attendee replies
      description: Retired raw-ICS entry point. Read the actual mailbox message through /mailbox/calendars/invitations
        instead; a claimed attendee string is not sender authentication.
      security:
      - MailboxBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '400':
          description: INVITATION_SOURCE_REQUIRED.
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /domains/{id}/authority:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    get:
      operationId: getDomainDNSAuthority
      summary: Inspect live authoritative DNS signing and delegation evidence
      description: Requires the current tenant owner or admin and an active verified managed domain. Delegated domains
        are rejected. Reports local signature, parent DS and validation-chain evidence without returning private keys
        or TSIG secrets.
      security:
      - Bearer: []
      responses:
        '200':
          description: Live bounded agent observation; ready is true only after current parent DS and a cryptographic
            validation chain succeed.
        '403':
          description: Current role does not permit authoritative DNS administration.
        '404':
          description: Domain does not belong to the current tenant.
        '409':
          description: Managed verified authority is required or the operation needs review.
        '503':
          description: Root agent or authoritative DNS capability is unavailable.
    post:
      operationId: manageDomainDNSAuthority
      summary: Confirm one bounded DNSSEC or secondary configuration operation
      description: Requires owner/admin authorization and the active session CSRF token. The request is bound to the
        current tenant, domain ID, domain name and actor before the root agent rechecks ownership and current role.
        Parent DS changes are never automatic. Retirement requires successor delegation, removal of old DS and cache
        expiry. Signing disablement requires validated parent DS removal and a bounded cache wait. Private secondary
        bundles can only be exported by the root CLI, never through this API.
      security:
      - Bearer: []
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
