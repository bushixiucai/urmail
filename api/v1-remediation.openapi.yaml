components:
  securitySchemes:
    MailboxBearer:
      type: http
      scheme: bearer
      description: Independent native mailbox-session token. Panel bearer tokens never authorize mailbox contents.
    Bearer:
      type: http
      scheme: bearer
      description: Active panel-session token. A legacy-only session is rejected.
    CSRF:
      type: apiKey
      in: header
      name: X-CSRF-Token
  responses:
    Error:
      description: 400 invalid input; 401 unauthenticated; 403 role/scope/CSRF/factor denial; 404 unknown or cross-tenant
        object; 409 conflict; 429 rate limited; 5xx infrastructure/provider failure. The HTTP status and machine
        code are preserved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    NativeMailboxCompose:
      type: object
      properties:
        to: {type: array, items: {type: string, format: email}}
        cc: {type: array, items: {type: string, format: email}}
        bcc: {type: array, items: {type: string, format: email}}
        subject: {type: string, maxLength: 998}
        text: {type: string}
        html: {type: string}
        attachments:
          type: array
          description: At most 10 MiB of decoded bytes in total; each nonempty file is at most 5 MiB.
          maxItems: 10
          items:
            type: object
            required: [filename, content_type, content_base64]
            properties:
              filename: {type: string}
              content_type: {type: string}
              content_base64: {type: string, format: byte, description: 'One nonempty attachment, at most 5 MiB decoded.'}
    NativeMailboxSchedule:
      type: object
      required: [id, draft_folder, draft_uid, draft_uidvalidity, send_at, status, attempts, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        draft_folder: {type: string}
        draft_uid: {type: integer, minimum: 1}
        draft_uidvalidity: {type: integer, minimum: 0, description: Zero only on pre-safety tasks held for review.}
        send_at: {type: string, format: date-time}
        next_attempt_at: {type: string, format: date-time}
        sent_at: {type: string, format: date-time}
        status: {type: string, enum: [pending, preparing, submitting, sent, uncertain, failed, cancelled, held]}
        attempts: {type: integer, minimum: 0}
        last_error: {type: string, description: Stable safe failure or review code.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: *id001
            message: *id001
            params:
              type: object
              additionalProperties: true
            details: {}
          required:
          - code
      required:
      - error
    Status:
      type: object
      properties:
        status: *id001
      required:
      - status
    PublicBrand:
      type: object
      properties:
        slug: *id001
        name: *id001
        theme:
          type: object
          additionalProperties: *id001
        logo_url:
          type: string
          nullable: true
        favicon_url:
          type: string
          nullable: true
        primary_color:
          type: string
          nullable: true
      required:
      - slug
      - name
      - theme
    Credential:
      type: object
      properties:
        id: *id004
        name: *id001
        scopes:
          type: array
          items: *id005
        expires_at: &id006
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at: *id006
      required:
      - id
      - name
      - scopes
      - expires_at
    FreshFactor:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Fresh TOTP or an unused recovery code.
      required:
      - code
    LegacySession:
      type: object
      properties:
        token: *id001
        csrf_token: *id001
        expires_at: *id006
      required:
      - token
      - csrf_token
      - expires_at
    SettingsPatch:
      type: object
      properties:
        settings:
          type: object
          properties:
            locale:
              type: string
              enum:
              - zh-CN
              - en
              nullable: true
            mailbox_default_quota_bytes:
              type: integer
              format: int64
              minimum: 1
              nullable: true
            theme:
              type: object
              properties:
                primary:
                  type: string
                  pattern: ^#[0-9a-fA-F]{6}$
              additionalProperties: false
              nullable: true
              required:
              - primary
          additionalProperties: false
      required:
      - settings
    Settings:
      type: object
      properties:
        settings:
          type: object
          additionalProperties: true
      required:
      - settings
    Usage:
      type: object
      properties:
        domains_used: *id004
        domains_limit: *id004
        mailboxes_used: *id004
        mailboxes_limit: *id004
        storage_bytes_limit: *id004
        storage_bytes_allocated: *id004
        storage_bytes_used:
          type: integer
          format: int64
          nullable: true
        storage_measured_at:
          type: string
          format: date-time
          nullable: true
        storage_error:
          type: string
          nullable: true
        storage_status:
          type: string
          enum:
          - measured
          - unknown
      required:
      - domains_used
      - domains_limit
      - mailboxes_used
      - mailboxes_limit
      - storage_bytes_limit
      - storage_bytes_allocated
      - storage_bytes_used
      - storage_measured_at
      - storage_error
      - storage_status
    TenantCurrent:
      type: object
      properties:
        tenant:
          type: object
          properties:
            id: *id004
            name: *id001
            slug: *id001
            status: *id001
            created_at: *id006
        settings:
          type: object
          additionalProperties: true
        theme:
          type: object
          nullable: true
          additionalProperties: true
        usage:
          $ref: '#/components/schemas/Usage'
        subscription:
          type: object
          properties:
            plan_code: *id001
            plan_name:
              type: object
              additionalProperties: *id001
            status: *id001
      required:
      - tenant
      - settings
      - theme
      - usage
      - subscription
    MarketingSuppressionRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    MarketingSuppression:
      type: object
      required: [id, tenant_id, email, reason, created_at]
      properties:
        id: *id004
        tenant_id: *id004
        email:
          type: string
          format: email
        reason:
          type: string
          enum: [unsubscribe, bounce, complaint, manual]
        created_at: *id006
    BrandHost:
      type: object
      properties:
        hostname: *id001
        brand_id: *id004
        created_at: *id006
      required:
      - hostname
      - brand_id
    BrandInput:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
        name:
          type: string
          minLength: 1
        theme:
          type: object
          additionalProperties: *id001
          description: Only primary, secondary, background, foreground, accent, ring and radius; bounded color/radius
            values.
        logo_url: *id001
        favicon_url: *id001
        primary_color: *id001
        status:
          type: string
          enum:
          - active
          - disabled
          default: active
      required:
      - slug
      - name
    ManagedBrand:
      allOf:
      - $ref: '#/components/schemas/PublicBrand'
      - type: object
        properties:
          id: *id004
          status:
            type: string
            enum:
            - active
            - disabled
          created_at: *id006
        required:
        - id
        - status
    Alias:
      type: object
      properties:
        id: *id004
        domain_id: *id004
        domain_fqdn: *id001
        local_part: *id001
        target: *id001
        kind:
          type: string
          enum:
          - alias
          - catchall
          - forward
        sender_logins:
          type: array
          readOnly: true
          description: Explicit sender identities preserved from reviewed migration. Receiving aliases do not imply sender authorization; routing edits revoke existing grants.
          maxItems: 100
          items:
            type: string
            format: email
        active:
          type: boolean
        created_at: *id006
    Plan:
      type: object
      properties:
        code: *id001
        name:
          type: object
          additionalProperties: *id001
        description:
          type: object
          additionalProperties: *id001
        price_cents:
          type: integer
          minimum: 0
        currency: *id001
        quota_bytes:
          type: integer
          minimum: -1
        mailbox_limit:
          type: integer
          minimum: -1
        domain_limit:
          type: integer
          minimum: -1
        daily_send_limit:
          type: integer
          minimum: -1
        features: {}
        sort_order:
          type: integer
        active:
          type: boolean
      required:
      - code
    Order:
      type: object
      properties:
        id: *id004
        tenant_id: *id004
        order_no: *id001
        plan_code:
          type: string
          nullable: true
        status: *id001
        amount_cents: *id004
        currency: *id001
        idempotency_key:
          type: string
          nullable: true
        created_at: *id006
        paid_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - tenant_id
      - order_no
      - status
      - amount_cents
      - currency
    Invoice:
      type: object
      properties:
        id: *id004
        tenant_id: *id004
        number: *id001
        amount_cents: *id004
        currency: *id001
        status: *id001
        period_start: *id006
        period_end: *id006
        issued_at: *id006
      required:
      - id
      - number
      - status
    PaidCalendarSpec:
      type: object
      description: HMAC-bound paid-service calendar. First activation or an expired-service restart has provisional dates until fulfillment; established timezones and historical paid terms never change.
      required: [timezone, anchor_at, version, reanchor, provisional]
      properties:
        timezone:
          type: string
          example: Asia/Shanghai
        anchor_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
        reanchor:
          type: boolean
          description: A complete new cycle after service interruption resets the date anchor, preserving the first billing timezone.
        provisional:
          type: boolean
        wall:
          type: object
          description: Persisted local wall-clock fields, preserving the original day even after a short-month clamp or a later timezone-database update.
          properties:
            timezone: {type: string}
            day: {type: integer, minimum: 1, maximum: 31}
            hour: {type: integer, minimum: 0, maximum: 23}
            minute: {type: integer, minimum: 0, maximum: 59}
            second: {type: integer, minimum: 0, maximum: 59}
            nanosecond: {type: integer, minimum: 0, maximum: 999999999}
    Quote:
      type: object
      properties:
        calendar:
          $ref: '#/components/schemas/PaidCalendarSpec'
        plan_snapshot_digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: HMAC-bound canonical entitlement snapshot digest.
        document_snapshot_digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: HMAC-bound canonical commercial statement snapshot digest.
        tenant_id:
          type: integer
          format: int64
        domain_id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [new, renew, upgrade, downgrade]
        price_version:
          type: integer
          format: int64
        plan_amount_cents:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Undiscounted full cycle price frozen as the upgrade basis.
        subscription_version:
          type: integer
          format: int64
        coupon_code:
          type: string
        plan_code: *id001
        billing_cycle: *id001
        currency: *id001
        base_amount_cents: *id004
        discount_cents: *id004
        prorated_credit_cents: *id004
        final_amount_cents: *id004
        period_start: *id006
        period_end: *id006
        generated_at: *id006
        expires_at: *id006
        digest: *id001
      required:
      - plan_code
      - billing_cycle
      - currency
      - base_amount_cents
      - discount_cents
