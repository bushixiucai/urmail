openapi: 3.0.3
info:
  title: urMail M1-M7 remediation API contract
  version: 0.4.2-m1-m7-v2
  description: Endpoints added or changed in the M1-M7 remediation rounds. This is not a complete v1 specification
    or proof of runtime acceptance. Code-only legacy errors remain compatible. All mutating panel requests require
    Bearer and X-CSRF-Token; present Origin/Referer must match the host.
servers:
- url: /api/v1
security:
- Bearer: []
paths:
  /marketing/unsubscribe:
    get:
      summary: Show inert localized unsubscribe confirmation
      security: []
      description: GET never changes consent or dispatches. Only an unexpired signed token
        renders the human POST form. Escaped HTML, no-store, CSP and no-referrer. POST
        accepts explicit confirmation or RFC8058 one-click body.
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Escaped HTML confirmation page; no state change.
        '400':
          description: Invalid token.
        '503':
          description: Unavailable signing/persistence.
    post:
      summary: Persist a recipient opt-out using a stateless signed token.
      description: Public by design. Only possession of an unexpired signed token authorizes this operation.
      security: []
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Opt-out persisted or already present.
        '400':
          description: Missing, invalid, tampered, or expired token.
        '503':
          description: Unsubscribe signing configuration or persistence unavailable.
  /marketing/suppressions:
    get:
      summary: List up to 500 suppression entries for the authenticated tenant.
      description: Requires owner or admin role and tenant RLS context.
      responses:
        '200':
          description: Tenant suppression entries.
          content:
            application/json:
              schema:
                type: object
                required: [suppressions]
                properties:
                  suppressions:
                    type: array
                    items:
                      $ref: '#/components/schemas/MarketingSuppression'
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Add a manual suppression for the authenticated tenant.
      description: Requires owner or admin role. Existing unsubscribe, bounce, or complaint reasons cannot be downgraded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketingSuppressionRequest'
      responses:
        '201':
          description: Suppression created or existing permanent reason retained.
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Remove a manual suppression only; unsubscribe consent and bounce/complaint records are retained.
      description: Requires owner or admin role. Removal of an unsubscribe, bounce, or complaint entry is an idempotent no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketingSuppressionRequest'
      responses:
        '204':
          description: Manual suppression removed or not present.
        default:
          $ref: '#/components/responses/Error'
  /branding:
    get:
      summary: Resolve public visual branding; authorized Host wins over brand link, then default.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  brand:
                    $ref: '#/components/schemas/PublicBrand'
                  source:
                    type: string
                    enum:
                    - host
                    - link
                    - default
                required:
                - brand
                - source
        default:
          $ref: '#/components/responses/Error'
      security: []
      parameters:
      - name: brand
        in: query
        schema: &id001
          type: string
      description: Uses Request.Host, not an arbitrary X-Forwarded-Host. Brand selection never authenticates a user
        or selects a tenant. Disabled and unknown links fall back to default. Visual theme resolves brand row plus platform and brand theme settings through the same helper as authenticated tenant views; tenant overrides never affect this public response. Response omits internal settings,
        tenant IDs and unknown theme keys.
  /auth/legacy-session:
    post:
      summary: Create an independent 15-minute legacy-only session after fresh MFA.
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacySession'
        default:
          $ref: '#/components/responses/Error'
      security: &id002
      - Bearer: []
        CSRF: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreshFactor'
      description: Requires an active platform administrator with MFA enabled. Token is accepted by supported /admin/*
        and /api/v1/admin/* routes, and rejected by general v1 Bearer authentication. Writes require its csrf_token
        in X-CSRF-Token. It may be revoked through the existing session API.
  /auth/application-credentials:
    get:
      summary: List this user's application credentials, including revoked records; never expose a verifier.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  credentials:
                    type: array
                    items:
                      $ref: '#/components/schemas/Credential'
                required:
                - credentials
        default:
          $ref: '#/components/responses/Error'
      description: Any active panel session may list its own credentials even after platform demotion or MFA disablement.
    post:
      summary: Create a separately revocable legacy credential after fresh MFA.
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  credential:
                    $ref: '#/components/schemas/Credential'
                  token: *id001
                required:
                - credential
                - token
        default:
          $ref: '#/components/responses/Error'
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                scopes:
                  type: array
                  items: &id005
                    type: string
                    enum:
                    - legacy:read
                    - legacy:write
                  minItems: 1
                  maxItems: 2
                  uniqueItems: true
                expires_at:
                  type: string
                  format: date-time
                  description: Strictly in the future and no more than 365 days away.
                code:
                  type: string
                  minLength: 1
              required:
              - name
              - scopes
              - expires_at
              - code
      description: Requires the current platform role and MFA enabled. token uses the public urmail_app_ marker
        and is shown only in this response; only SHA-256 is stored. Use HTTP Basic email:token on supported legacy
        endpoints. legacy:write does not imply legacy:read. Active owner, current platform role, expiry and revocation
        are checked on every use. Password and panel-session revocation do not automatically revoke application
        credentials.
  /auth/application-credentials/{id}:
    parameters:
    - &id003
      name: id
      in: path
      required: true
      schema: &id004
        type: integer
        format: int64
    delete:
      summary: Revoke this user's credential; another user's ID returns 404.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          $ref: '#/components/responses/Error'
      security: *id002
      description: Does not require the owner to still be a platform administrator. Repeated revocation is safe.
        Creation, use and revocation produce redacted audit events.
  /platform/brands:
    get:
      summary: List managed brands, including disabled brands.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  brands:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagedBrand'
        default:
          $ref: '#/components/responses/Error'
      description: ' Requires the current platform administrator role.'
    post:
      summary: Create or replace editable fields of a brand by immutable slug.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  brand:
                    $ref: '#/components/schemas/ManagedBrand'
        default:
          $ref: '#/components/responses/Error'
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandInput'
      description: ' Requires the current platform administrator role.'
  /platform/brands/{id}/settings:
    parameters:
    - *id003
    get:
      summary: Read only this brand's own editable setting overrides.
      description: Requires the current platform administrator role. Missing brand returns 404. Omitted keys inherit platform defaults.
      responses:
        '200':
          description: Brand overrides, without merging inherited platform defaults.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Atomically change this brand's allowlisted setting overrides.
      description: Requires the current platform administrator role and CSRF token. Null removes this brand's override and restores platform inheritance. Tenant overrides retain priority. Unknown keys are rejected, including null values. Missing brand returns 404.
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          description: Committed brand overrides.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        default:
          $ref: '#/components/responses/Error'
  /platform/brands/{id}:
    parameters:
    - *id003
    delete:
      summary: Delete an unreferenced non-default brand; tenant references return 409.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          $ref: '#/components/responses/Error'
      security: *id002
      description: ' Requires the current platform administrator role.'
  /platform/brands/{id}/status:
    parameters:
    - *id003
    patch:
      summary: Enable or disable a non-default brand.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          $ref: '#/components/responses/Error'
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - active
                  - disabled
              required:
              - status
      description: ' Requires the current platform administrator role.'
  /platform/brands/{id}/reset-theme:
    parameters:
    - *id003
    post:
      summary: Clear this brand's visual fields and brand-level theme override.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          $ref: '#/components/responses/Error'
      security: *id002
      description: Tenant-level overrides are separate settings and are not silently removed. Requires the current
        platform administrator role.
  /platform/brand-hosts:
    get:
      summary: List platform-authorized host bindings.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  hosts:
                    type: array
                    items:
                      $ref: '#/components/schemas/BrandHost'
        default:
          $ref: '#/components/responses/Error'
      description: ' Requires the current platform administrator role.'
    post:
      summary: Authorize or replace a hostname binding to an active brand.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  host:
                    $ref: '#/components/schemas/BrandHost'
        default:
          $ref: '#/components/responses/Error'
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname:
                  type: string
                  description: DNS hostname only, without scheme, port or path.
                brand_id: *id004
              required:
              - hostname
              - brand_id
      description: ' Requires the current platform administrator role.'
  /platform/brand-hosts/{hostname}:
    parameters:
    - name: hostname
      in: path
      required: true
      schema: *id001
    delete:
      summary: Remove an existing hostname binding.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          $ref: '#/components/responses/Error'
      security: *id002
      description: ' Requires the current platform administrator role.'
  /platform/settings:
    get:
      summary: Read platform settings.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        default:
          $ref: '#/components/responses/Error'
      description: ' Requires the current platform administrator role.'
    patch:
      summary: Update or reset allowlisted platform settings.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        default:
          $ref: '#/components/responses/Error'
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      description: Null removes the local override. Only locale, mailbox_default_quota_bytes and theme.primary are
        accepted; runtime secrets are not accepted as settings fields. Requires the current platform administrator
        role.
  /tenants/current:
    get:
      summary: Read current tenant, inherited settings, branding and measured usage.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCurrent'
        default:
          $ref: '#/components/responses/Error'
      description: Zero and -1 quota semantics follow the current plan contract; unknown storage usage is null with
        an explicit status, never fabricated as zero.
    patch:
      summary: Owner/admin updates or resets current-tenant settings.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCurrent'
        default:
          $ref: '#/components/responses/Error'
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      description: Null removes the tenant override and restores inheritance. No platform or brand setting is writable
        through this endpoint.
  /aliases/{id}:
    parameters:
    - *id003
    patch:
      summary: Owner/admin updates an alias or catchall without changing its domain.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  alias:
                    $ref: '#/components/schemas/Alias'
        default:
          $ref: '#/components/responses/Error'
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                local_part:
                  type: string
                  maxLength: 64
                target:
                  type: string
                  maxLength: 320
                kind:
                  type: string
                  enum:
                  - alias
                  - catchall
                  - forward
                active:
                  type: boolean
      description: Missing fields preserve current values. Conflicts and loops are rejected; cross-tenant IDs return
        404. Successful updates trigger reconcile after commit.
  /platform/plans:
    get:
      summary: List platform plans, including inactive plans.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plan'
        default:
          $ref: '#/components/responses/Error'
      description: ' Requires the current platform administrator role.'
    post:
      summary: Create or update a plan, including active status; existing allocations remain protected.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    $ref: '#/components/schemas/Plan'
        default:
          $ref: '#/components/responses/Error'
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Plan'
      description: ' Requires the current platform administrator role.'
  /platform/plans/{code}:
    parameters:
    - name: code
      in: path
      required: true
      schema: *id001
    delete:
      summary: Delete an unused non-default plan; historical references return 409.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          $ref: '#/components/responses/Error'
      security: *id002
      description: ' Requires the current platform administrator role.'
  /billing/quote:
    post:
      summary: Generate an immutable, tamper-evident pricing quote before checkout.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        default:
          $ref: '#/components/responses/Error'
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain_id:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Owned active verified domain. Omitted legacy bodies resolve an owned verified domain; no verified domain means refusal.
                currency:
                  type: string
                  enum: [CNY, USD]
                plan_code: *id001
                billing_cycle:
                  type: string
                  enum:
                  - monthly
                  - quarterly
                  - annual
                coupon_code:
                  type: string
                  nullable: true
                  description: Optional coupon applied to the quote. Unknown or
                    invalid codes fail with 404 COUPON_NOT_FOUND / 409 COUPON_INVALID
                    instead of being ignored; a valid code is reflected in
                    discount_cents of the returned Quote.
              required:
              - plan_code
              - billing_cycle
      description: Returns an immutable pricing snapshot with an HMAC integrity digest and expiration
        timestamp. The digest is keyed with a server-side signing key; requests are rejected with
        500 QUOTE_KEY_UNCONFIGURED when the deployment lacks one.
  /billing/checkout:
    post:
      summary: Create or resume an order for an active plan.
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
                  payment_method:
                    type: string
                    enum:
                    - manual
                    - stripe
                    - wechat
                    - alipay
                    - paypal
                  checkout_url:
                    type: string
                    format: uri
                required:
                - order
                - payment_method
        '202':
          description: The persisted checkout is uncertain, awaiting receipt review, or pending provider reconciliation. No blind external retry occurs.
        default:
          $ref: '#/components/responses/Error'
      security: *id002
      parameters:
      - name: Idempotency-Key
        in: header
        schema:
          type: string
          maxLength: 200
        description: Required for reliable retry; scoped to the current tenant and full signed quote intent. The same key with a different digest conflicts. A committed order remains recoverable after quote expiry or catalog withdrawal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  merchant_id:
                    type: integer
                    format: int64
                    minimum: 1
                    description: Select a ready merchant supporting the quoted currency and amount.
                  quote:
                    $ref: '#/components/schemas/Quote'
                required:
                - quote
              - type: object
                properties:
                  plan_code: *id001
                  billing_cycle: *id001
                  coupon_code: *id001
                required:
                - plan_code
      description: A pending order commits before Stripe is contacted. Preferred flow is POST /billing/quote first
        and passing the signed quote back; the legacy plan_code body is still accepted and is priced server-side, so
        the tenant cannot bypass the signed-pricing path. A fully discounted (zero-amount) order settles immediately
        without a cash receipt or refundable payment. An ambiguous external result returns the durable order and remains uncertain (202 on retry); retries never blindly create another session. Missing confirmed merchant limits prevents new payment creation. Existing intents remain queryable.
        This is not a distributed transaction or a real-payment guarantee. An already-paid resumed order has no
        checkout_url.
  /billing/orders/{id}/cancel:
    post:
      summary: Cancel a pending order and release its coupon reservation.
      security: *id002
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Order canceled; coupon_released reports whether reserved quota was returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
                  coupon_released:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
  /billing/refunds:
    post:
      summary: Record a refund request against a successful payment.
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_id:
                  type: integer
                  format: int64
                refund_no:
                  type: string
                amount_cents:
                  type: integer
                  format: int64
                reason:
                  type: string
              required:
              - payment_id
              - refund_no
              - amount_cents
      responses:
        '201':
          description: Refund reservation recorded (status pending until approved and processed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund:
                    $ref: '#/components/schemas/Refund'
        default:
          $ref: '#/components/responses/Error'
    get:
      summary: List the tenant's refund requests, newest first.
      security: *id002
      responses:
        '200':
          description: Refund list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  refunds:
                    type: array
                    items:
                      $ref: '#/components/schemas/Refund'
        default:
          $ref: '#/components/responses/Error'
  /onboarding/tasks:
    get:
      summary: List the tenant's provisioning onboarding tasks.
      security: *id002
      responses:
        '200':
          description: Onboarding task list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      type: object
        default:
          $ref: '#/components/responses/Error'
  /billing/orders:
    get:
      summary: List up to 100 orders of the current tenant.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        default:
          $ref: '#/components/responses/Error'
  /platform/orders/{id}/paid:
    parameters:
    - *id003
    post:
      summary: Manually settle an order exactly once; repeated paid requests succeed without a second invoice.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          $ref: '#/components/responses/Error'
      security: *id002
      description: ' Requires the current platform administrator role.'
  /billing/invoices:
    get:
      summary: List current-tenant invoices.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
        default:
          $ref: '#/components/responses/Error'
  /billing/invoices/{id}/pdf:
    parameters:
    - *id003
    get:
      summary: Render the current tenant's invoice as a PDF attachment. Cross-tenant IDs return 404.
      responses:
        '200':
          description: Embedded CJK font commercial statement from immutable quote parties and tax snapshot. Owner/admin/billing only; mandatory READ audit succeeds before bytes release. Original total is unchanged by refunds; completed source-payment refunds and current void status are disclosed. Missing legacy snapshots are explicitly marked without using current profiles. This is not a formal tax invoice. No global cache, OS font or remote font request is required.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /compliance/recalls:
    post:
      summary: Request recall of one local mailbox copy as tenant owner or admin.
      description: The archive entry determines the mailbox and message. Legal hold returns 409. A unique tenant/archive target makes duplicates idempotent. The request commits before the root agent resolves and expunges an exact local message. The compliance archive is preserved. Remote delivery cannot be recalled. Transport failure leaves pending for the same POST to retry.
      security:
      - Bearer: []
        CSRF: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [archive_entry_id]
              properties:
                archive_entry_id:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        '200':
          description: Existing or newly completed local outcome; inspect status and reason.
          content:
            application/json:
              schema:
                type: object
                required: [recall]
                properties:
                  recall:
                    $ref: '#/components/schemas/Recall'
        '202':
          description: Durably pending; retry the same target or GET its status.
          content:
            application/json:
              schema:
                type: object
                required: [recall]
                properties:
                  recall:
                    $ref: '#/components/schemas/Recall'
        default:
          $ref: '#/components/responses/Error'
    get:
      summary: List the latest hundred tenant recalls as owner or admin.
      responses:
        '200':
          description: Local mailbox scope only.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope:
                    type: string
                    enum: [local_mailbox]
