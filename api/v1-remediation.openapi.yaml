    get:
      summary: Render the current tenant's invoice as a PDF attachment. Cross-tenant IDs return 404.
      responses:
        '200':
          description: Embedded CJK font commercial statement from immutable quote parties and tax snapshot. Owner/admin/billing only; mandatory READ audit succeeds before bytes release. Original total is unchanged by refunds; completed source-payment refunds and current void status are disclosed. Missing legacy snapshots are explicitly marked without using current profiles. This is not a formal tax invoice. No global cache, OS font or remote font request is required.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /compliance/recalls:
    post:
      operationId: confirmLocalRecall
      summary: Confirm explicitly selected copies from a current reviewed snapshot
      description: Requires owner/admin authority and CSRF. Legacy archive_entry_id-only requests are rejected. Every
        target proof must belong to the current actor and tenant; selected keys must be unique members of that exact
        preview. Confirmation and its audit commit before the agent can mutate anything. The agent locks current role/tenant/hold
        facts and revalidates snapshot and mailbox generation, then expunges using mailbox GUID AND UID AND immutable
        message GUID. New same-Message-ID arrivals cannot broaden an old selector. Repeating the identical confirmed
        proof reconciles that same intent; completed results never perform another destructive command. A different
        selection or an expired/stale/restored proof requires a fresh preview. Partial/unknown outcomes retain per-copy
        facts. For a new attempt, preview again and explicitly choose only outstanding copies; successful items are
        not automatically selected. Restored intents are held and old tokens cannot mutate until a fresh authorized
        review is confirmed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - confirmed
              - targets
              properties:
                confirmed:
                  type: boolean
                  enum:
                  - true
                targets:
                  type: array
                  minItems: 1
                  maxItems: 20
                  description: At most 100 selected copies across all targets
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - id
                    - preview_token
                    - digest
                    - copy_keys
                    properties:
                      id:
                        type: integer
                        format: int64
                        minimum: 1
                      preview_token:
                        type: string
                        format: uuid
                      digest:
                        type: string
                        pattern: ^[a-f0-9]{64}$
                      copy_keys:
                        type: array
                        minItems: 1
                        maxItems: 100
                        uniqueItems: true
                        items:
                          type: string
      responses:
        '200':
          description: Recorded results, including partial failure, expired or unknown status. A 200 envelope does
            not imply local deletion success and never implies external recipient recall. Inspect each recall and
            local_result item.
          content:
            application/json:
              schema:
                type: object
                required:
                - recalls
                - scope
                - remote_recall_guaranteed
                properties:
                  scope:
                    type: string
                    enum:
                    - local_mailbox
                  remote_recall_guaranteed:
                    type: boolean
                    enum:
                    - false
                  recalls:
                    type: array
                    maxItems: 20
                    items:
                      type: object
                      required:
                      - id
                      - status
                      - scope
                      - attempt_epoch
                      - selected_copy_keys
                      - local_result
                      properties:
                        id:
                          type: integer
                          format: int64
                        status:
                          type: string
                          enum:
                          - preview
                          - pending
                          - delivered
                          - failed
                          - expired
                          - local_recalled
                          - uncertain
                        reason:
                          type: string
                          nullable: true
                        scope:
                          type: string
                          enum:
                          - local_mailbox
                        attempt_epoch:
                          type: integer
                          format: int64
                        selected_copy_keys:
                          type: array
                          items:
                            type: string
                        local_result:
                          type: object
                          properties:
                            items:
                              type: array
                              items:
                                type: object
                                required:
                                - key
                                - status
                                properties:
                                  key:
                                    type: string
                                  status:
                                    type: string
                                    enum:
                                    - confirmed_absent
                                    - failed
                                    - unknown
                                  reason:
                                    type: string
        '202':
          description: Committed exact intent remains pending; reconcile the same proof without changing its selection
        '400':
          description: Explicit reviewed confirmation missing
          malformed selection: null
          duplicate target or legacy immediate request: null
        '401':
          description: Authentication required
        '403':
          description: Current actor role or CSRF authority refused
        '409':
          description: Stale
          expired: null
          changed or mismatched review; obtain a new preview: null
        '422':
          description: Selected copy count exceeds the safety bound
        '503':
          description: Inventory/database unavailable; inspect persisted state before any new attempt
    get:
      operationId: listLocalRecalls
      summary: List the latest hundred tenant-scoped recall facts
      description: Owner/admin only. Includes status, exact selected keys, per-copy local results and attempt history.
        This route never executes mail operations.
      responses:
        '200':
          description: Object containing recalls array and scope=local_mailbox
        '401':
          description: Authentication required
        '403':
          description: Current role refused
  /compliance/recalls/{id}:
    get:
      operationId: getLocalRecall
      summary: Read one persisted local recall and its immutable result facts
      description: Owner/admin only. Opening an old link rechecks the current tenant and role. No mutation or privilege
        is granted by possession of a recall ID.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Object containing the same recall DTO used by preview and confirmation
        '400':
          description: Invalid ID
        '401':
          description: Authentication required
        '403':
          description: Current role refused
        '404':
          description: Recall absent or outside the current tenant
  /audit:
    get:
      summary: Read tenant audit history with stable composite pagination.
      parameters:
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500}}
      - {name: actor_user_id, in: query, schema: {type: integer, format: int64}}
      - {name: action, in: query, schema: {type: string}}
      - {name: target_type, in: query, schema: {type: string}}
      - {name: target_id, in: query, schema: {type: string}}
      - {name: from, in: query, schema: {type: string, format: date-time}}
      - {name: to, in: query, schema: {type: string, format: date-time}}
      - {name: cursor, in: query, schema: {type: string, maxLength: 2048}}
      - {name: before_id, in: query, schema: {type: integer}, description: Legacy cursor; resolves the anchor timestamp within this tenant. Cannot be combined with cursor.}
      responses:
        '200':
          description: logs plus next_cursor. Each detail is a JSON object containing only status/outcome/phase, or null for missing/invalid metadata; never base64. Cursor binds tenant and filters and validates its persisted timestamp/id anchor.
        '400':
          description: Invalid range, cursor, or cursor/filter mismatch.
        default:
          $ref: '#/components/responses/Error'
  /audit/export:
    get:
      summary: Export one consistent filtered audit metadata snapshot as CSV.
      parameters:
      - {name: actor_user_id, in: query, schema: {type: integer, format: int64}}
      - {name: action, in: query, schema: {type: string}}
      - {name: target_type, in: query, schema: {type: string}}
      - {name: target_id, in: query, schema: {type: string}}
      - {name: from, in: query, schema: {type: string, format: date-time}}
      - {name: to, in: query, schema: {type: string, format: date-time}}
      description: Requires tenant owner/admin. Uses the same actor/action/object/from/to filters as GET /audit, without page cursors. More than 10000 rows or 7 MiB returns 413 before releasing data, never a silently truncated file. Download is audited before the transaction commits and releases the response. CSV formula prefixes are escaped.
      responses:
        '200':
          description: Tenant-scoped CSV attachment.
          content:
            text/csv:
              schema: {type: string}
        '413':
          description: Narrow the filter/time range and retry.
        '503':
          description: Audit persistence unavailable; no export is released.
        default:
          $ref: '#/components/responses/Error'
  /compliance/grants:
    get:
      summary: List current and historical grants and eligible recipients.
