driver = pgsql
connect = host=127.0.0.1 dbname=urmail user=urmail_dovecot password=secret sslmode=disable
default_pass_scheme = SHA512-CRYPT

password_query = SELECT m.address AS user, m.password_hash AS password FROM mailboxes m JOIN tenants t ON t.id = m.tenant_id JOIN domains d ON d.id = m.domain_id AND d.tenant_id = m.tenant_id WHERE m.address = '%u' AND m.status = 'active' AND t.status = 'active' AND d.status = 'active' AND urmail_domain_mail_ready(m.tenant_id,m.domain_id);

user_query = SELECT m.address AS user, 'mail' AS uid, 'mail' AS gid, '/var/mail/mail/mailboxes/%d/%n' AS home, '*:bytes=' || CASE WHEN m.quota_bytes = -1 THEN '0' ELSE m.quota_bytes::text END AS quota_rule, CASE WHEN urmail_mail_readable(m.tenant_id) THEN '' ELSE 'expired' END AS acl_groups, CASE WHEN m.sieve_mode='legacy_v80' THEN 'file:/var/mail/mail/sieve/%d/%n;active=/var/mail/mail/sieve/%d/%n.sieve' ELSE 'file:/var/mail/sieve/%u.sieve' END AS sieve, CASE WHEN m.sieve_mode='legacy_v80' THEN '/var/mail/mail/sieve/%d/%n' ELSE NULL END AS sieve_dir, CASE WHEN m.sieve_mode='legacy_v80' THEN '/var/mail/mail/sieve/global_before' ELSE NULL END AS sieve_before2, CASE WHEN m.sieve_mode='legacy_v80' THEN '/var/mail/mail/sieve/global_after' ELSE NULL END AS sieve_after, CASE WHEN m.sieve_mode='legacy_v80' THEN 'recipient' ELSE NULL END AS sieve_redirect_envelope_from FROM mailboxes m JOIN tenants t ON t.id = m.tenant_id JOIN domains d ON d.id = m.domain_id AND d.tenant_id = m.tenant_id WHERE m.address = '%u' AND ((m.status = 'active' AND t.status = 'active' AND d.status = 'active' AND urmail_domain_mail_ready(m.tenant_id,m.domain_id)) OR '%s' = 'doveadm');

iterate_query = SELECT m.address AS user FROM mailboxes m JOIN tenants t ON t.id = m.tenant_id JOIN domains d ON d.id = m.domain_id AND d.tenant_id = m.tenant_id WHERE m.status = 'active' AND t.status = 'active' AND d.status = 'active' AND urmail_domain_mail_ready(m.tenant_id,m.domain_id);
