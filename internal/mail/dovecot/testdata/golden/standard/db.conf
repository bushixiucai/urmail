# Generated by urmaild. DO NOT EDIT.
# Permissions must be 0640 root:dovecot

driver = sqlite
connect = /var/lib/urmail/dovecot-auth.db
default_pass_scheme = SHA512-CRYPT

password_query = SELECT m.address AS user, m.password_hash AS password FROM mailboxes m WHERE m.address = '%u' AND m.status = 'active' AND EXISTS(SELECT 1 FROM tenants t WHERE t.tenant_id = m.tenant_id AND t.status = 'active') AND EXISTS(SELECT 1 FROM domains d WHERE d.tenant_id = m.tenant_id AND d.domain_id = m.domain_id AND d.status = 'active' AND d.mail_ready = 1);

user_query = SELECT m.address AS user, 'mail' AS uid, 'mail' AS gid, '/var/mail/mail/mailboxes/%d/%n' AS home, '*:bytes=' || CASE WHEN m.quota_bytes = -1 THEN '0' ELSE CAST(m.quota_bytes AS TEXT) END AS quota_rule, CASE WHEN EXISTS(SELECT 1 FROM tenants t WHERE t.tenant_id = m.tenant_id AND t.status = 'active') THEN '' ELSE 'expired' END AS acl_groups, CASE WHEN m.sieve_mode='legacy_v80' THEN 'file:/var/mail/mail/sieve/%d/%n;active=/var/mail/mail/sieve/%d/%n.sieve' ELSE 'file:/var/mail/sieve/%u.sieve' END AS sieve, CASE WHEN m.sieve_mode='legacy_v80' THEN '/var/mail/mail/sieve/%d/%n' ELSE NULL END AS sieve_dir, CASE WHEN m.sieve_mode='legacy_v80' THEN '/var/mail/mail/sieve/global_before' ELSE NULL END AS sieve_before2, CASE WHEN m.sieve_mode='legacy_v80' THEN '/var/mail/mail/sieve/global_after' ELSE NULL END AS sieve_after, CASE WHEN m.sieve_mode='legacy_v80' THEN 'recipient' ELSE NULL END AS sieve_redirect_envelope_from FROM mailboxes m WHERE m.address = '%u' AND ((m.status = 'active' AND EXISTS(SELECT 1 FROM tenants t WHERE t.tenant_id = m.tenant_id AND t.status = 'active') AND EXISTS(SELECT 1 FROM domains d WHERE d.tenant_id = m.tenant_id AND d.domain_id = m.domain_id AND d.status = 'active' AND d.mail_ready = 1)) OR '%s' = 'doveadm');

iterate_query = SELECT m.address AS user FROM mailboxes m WHERE m.status = 'active' AND EXISTS(SELECT 1 FROM tenants t WHERE t.tenant_id = m.tenant_id AND t.status = 'active') AND EXISTS(SELECT 1 FROM domains d WHERE d.tenant_id = m.tenant_id AND d.domain_id = m.domain_id AND d.status = 'active' AND d.mail_ready = 1);
