# Generated by urmaild. DO NOT EDIT.

# Protocols and Core
protocols = imap pop3 lmtp sieve
mail_plugins = quota acl
listen = *
default_process_limit = 250
default_client_limit = 1000

# Authentication
disable_plaintext_auth = yes
auth_mechanisms = plain login

!include /etc/dovecot/conf.d/urmail/dovecot-sql.conf.ext

# Mail Location and Permissions
mail_location = maildir:/mnt/storage/mail/mail/mailboxes/%d/%n
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 0

# TLS / SSL Settings
ssl = required
ssl_cert = </var/mail/ssl/box.urmail.cn.cert
ssl_key = </var/mail/ssl/box.urmail.cn.key
ssl_min_protocol = TLSv1.2
ssl_cipher_list = ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
ssl_prefer_server_ciphers = no

# LMTP and Postfix SASL Services
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0660
    user = postfix
    group = postfix
  }
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

!include /etc/dovecot/conf.d/urmail/dovecot-mailboxes.conf.ext
!include /etc/dovecot/conf.d/urmail/dovecot-quota.conf.ext
