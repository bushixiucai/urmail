name: CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.3"
  GOPROXY: https://goproxy.cn,direct
  npm_config_registry: https://registry.npmmirror.com

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: sqlc drift check
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          "$(go env GOPATH)/bin/sqlc" generate
          git diff --exit-code -- internal/store

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=10m

      - name: Message catalogue consistency
        run: go run ./cmd/i18ncheck

      - name: Report coverage
        run: |
          go tool cover -func=coverage.out | tee /tmp/urmail-coverage.txt
          sha256sum coverage.out
          {
            echo '### Go coverage'
            echo '```text'
            tail -n 1 /tmp/urmail-coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Install browser for isolated webmail privacy regression
        run: npx playwright install --with-deps chromium

      - name: Test native webmail privacy in Chromium
        env:
          URMAIL_E2E_NATIVE_FIXTURE: "1"
          URMAIL_E2E_BASE_URL: http://127.0.0.1:5187
        run: npx playwright test e2e/native-webmail.spec.ts --workers=1

      - name: Build
        run: npm run build

  integration:
    name: Integration (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: urmail
          POSTGRES_PASSWORD: urmail
          POSTGRES_DB: urmail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urmail -d urmail"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install recovery test tools
        run: sudo apt-get update && sudo apt-get install -y age postgresql-client-16

      - name: Test against PostgreSQL
        env:
          URMAIL_TEST_DATABASE_URL: postgres://urmail:urmail@127.0.0.1:5432/urmail?sslmode=disable
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          go test -race -timeout 20m -p 1 ./internal/... ./cmd/...

  native-webmail:
    name: Native webmail (Postfix and Dovecot)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build the disposable mail protocol fixture
        run: docker build -t urmail-native-webmail-ci:22.04 -f .github/fixtures/native-webmail.Dockerfile .github/fixtures

      - name: Exercise real native mail protocols and HTTP
        run: |
          python3 scripts/native-webmail-protocol-acceptance.py \
            --image urmail-native-webmail-ci:22.04 \
            --evidence tmp/native-webmail-ci

      - name: Exercise spam milter and recipient-specific delivery rules
        env:
          URMAIL_POSTFIX_TEST_IMAGE: urmail-native-webmail-ci:22.04
          URMAIL_SIEVE_TEST_IMAGE: urmail-native-webmail-ci:22.04
        run: go test ./internal/mailspam ./internal/mail/dovecot -count=1

      - name: Preserve protocol diagnostics in the job log
        if: always()
        run: |
          if [ -d tmp/native-webmail-ci ]; then
            find tmp/native-webmail-ci -maxdepth 1 -type f \
              \( -name '*.log' -o -name 'runtime-result.json' \) \
              -print -exec cat {} \;
          fi

  embed:
    name: Embedded frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Copy the bundle into the embed directory
        run: |
          rm -rf internal/web/dist
          cp -R web/dist internal/web/dist

      - name: Build the binary
        run: go build -o /tmp/urmaild ./cmd/urmaild

      - name: Verify the bundle is inside the binary
        run: |
          if ! strings /tmp/urmaild | grep "assets/index" >/dev/null; then
            echo "the frontend bundle is missing from the binary" >&2
            exit 1
          fi

  package-smoke:
    name: Package smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Embed frontend
        run: |
          rm -rf internal/web/dist
          cp -R web/dist internal/web/dist
          touch internal/web/dist/.gitkeep

      - name: Build binaries and deb
        run: |
          make build-go
          bash packaging/deb/build.sh 0.0.0-ci

      - name: Inspect package contents
        run: |
          deb=$(ls dist/urmail_0.0.0-ci_*.deb | head -1)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | grep -E 'urmaild$|urmaild-agent$|urmail-archive|urmail-cert-renew.timer|bootstrap.sql'
          test -f dist/urmail_0.0.0-ci_*.deb

  shellcheck:
    name: Shell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Lint the shell scripts
        run: |
          find installer packaging scripts -name '*.sh' -print0 \
            | xargs -0 -r shellcheck --severity=warning --external-sources

      - name: Test release CI gate
        run: python3 scripts/test-verify-release-ci.py

      - name: Syntax check
        run: find . -name '*.sh' -not -path './web/*' -print0 | xargs -0 -r -n1 bash -n

  browser:
    name: Development stack and browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend and browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start development stack
        run: |
          make dev > /tmp/urmail-dev.log 2>&1 &
          for attempt in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null && curl -fsS http://127.0.0.1:8080/api/v1/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/urmail-dev.log
          exit 1
      - name: Exercise real HTTP and browser
        run: |
          export URMAIL_ACCEPTANCE_EMAIL=admin@example.test
          export URMAIL_ACCEPTANCE_PASSWORD="$(cat tmp/dev/admin-password)"
          python3 scripts/remediation-http-smoke.py --disposable --base-url http://127.0.0.1:8080
          cd web
          URMAIL_E2E_BASE_URL=http://127.0.0.1:5173 URMAIL_E2E_EMAIL="$URMAIL_ACCEPTANCE_EMAIL" URMAIL_E2E_PASSWORD="$URMAIL_ACCEPTANCE_PASSWORD" npx playwright test
          npm run lint
      - name: Stop development stack
        if: always()
        run: make dev-down

  install:
    name: Linux installation (${{ matrix.os }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the installable candidate
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cd web
          npm ci
          cd ..
          make build VERSION=0.0.0-ci
          bash packaging/deb/build.sh 0.0.0-ci
      - name: Verify installer configuration preservation
        run: python3 -m unittest discover -s installer -p 'test_*.py'
      - name: Exercise installer and release download contracts
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          sudo env URMAIL_MYHOSTNAME=box.example.test URMAIL_PRIMARY_DOMAIN=example.test \
            URMAIL_PUBLIC_IPV4=127.0.0.1 URMAIL_NAMESERVERS=ns1.example.test \
            URMAIL_ADMIN_EMAIL=admin@example.test URMAIL_ADMIN_PASSWORD=CIOnlyPassword123 \
            python3 scripts/test-release-installer.py --disposable \
            --package "$(pwd)/dist/urmail_0.0.0-ci_${ARCH}.deb" --version 0.0.0-ci
          sudo urmailctl config status --wait 90s
      - name: Preserve service diagnostics
        if: failure()
        run: sudo journalctl -u urmaild -u urmaild-agent --no-pager -n 100

  security:
    name: Security dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Audit locked npm dependencies
        run: npm audit --prefix web --audit-level=moderate --registry=https://registry.npmjs.org
