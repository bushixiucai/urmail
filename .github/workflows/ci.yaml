name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.3"
  NODE_VERSION: "22.11.0"
  GOPROXY: https://goproxy.cn,direct
  npm_config_registry: https://registry.npmmirror.com

# ===========================================================================
# Job map - read this before changing a job
#
# `changes` is the gatekeeper.  It diffs the push or pull request against its
# base and classifies every touched path into one of four groups; every other
# job declares `needs: changes` plus an `if:` condition built from them, so a
# pull request only pays for the jobs its change can actually break.
#
# Path rules (scripts/ci-detect-changes.py owns them):
#   docs      *.md, VERSION, docs/**            -> only the Shell job runs
#   go        internal/**, cmd/**, api/**, *.go, go.mod, go.sum, Makefile,
#             packaging/**, installer/**, scripts/**
#   frontend  web/**                            -> frontend-consuming jobs
#   deps      go.mod, go.sum, web/package.json, web/package-lock.json
#   anything else (for example .github/**)       -> every job runs (fail-safe)
#   push to main, tag pushes, manual runs        -> every job runs
#
# Job semantics - no job is ever removed or weakened, it is only skipped when
# the change cannot break it:
#   Go             tidy, build, vet, sqlc drift, unit tests with coverage,
#                  golangci-lint, message catalogue check
#   Integration    the same Go suite against PostgreSQL, split into four
#                  disjoint shards (scripts/ci-integration-shards.py) that
#                  run in parallel with one database each
#   Frontend       typecheck, lint, vitest, native webmail privacy e2e
#   Embedded       frontend bundle inside the Go binary
#   Package smoke  deb build and content check
#   Native webmail real Postfix/Dovecot protocol acceptance
#   Browser        development stack and browser end-to-end tests
#   Install        installer contract on three OS/architecture combinations
#   Shell          shellcheck, release gate test, shell syntax
#   Security       govulncheck and npm audit
#
# The frontend-consuming jobs (Embedded, Package smoke, Install, Browser)
# build web/dist themselves: internal/web/dist is not committed, so skipping
# that build would leave the binary without a bundle and break the very
# check those jobs exist for.
# ===========================================================================

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      go: ${{ steps.detect.outputs.go }}
      frontend: ${{ steps.detect.outputs.frontend }}
      deps: ${{ steps.detect.outputs.deps }}
      docs: ${{ steps.detect.outputs.docs }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Classify the changed paths
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: python3 scripts/ci-detect-changes.py

  go:
    name: Go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup-go-toolchain
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go module downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Go tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/bin
          key: gobin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yaml') }}
          restore-keys: |
            gobin-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: sqlc drift check
        run: |
          bash scripts/ci-go-install.sh github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          "$(go env GOPATH)/bin/sqlc" generate
          git diff --exit-code -- internal/store

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: golangci-lint
        run: |
          bash scripts/ci-go-install.sh github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=10m

      - name: Message catalogue consistency
        run: go run ./cmd/i18ncheck

      - name: Report coverage
        run: |
          go tool cover -func=coverage.out | tee /tmp/urmail-coverage.txt
          sha256sum coverage.out
          {
            echo '### Go coverage'
            echo '```text'
            tail -n 1 /tmp/urmail-coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup-node-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Install browser for isolated webmail privacy regression
        run: npx playwright install --with-deps chromium

      - name: Test native webmail privacy in Chromium
        env:
          URMAIL_E2E_NATIVE_FIXTURE: "1"
          URMAIL_E2E_BASE_URL: http://127.0.0.1:5187
        run: npx playwright test e2e/native-webmail.spec.ts --workers=1

      - name: Build
        run: npm run build

  integration:
    name: Integration (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard:
          - handlers
          - data
          - platform
          - core
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: urmail
          POSTGRES_PASSWORD: urmail
          POSTGRES_DB: urmail_${{ matrix.shard }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urmail -d urmail_${{ matrix.shard }}"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup-go-toolchain
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go module downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ runner.arch }}-

      - name: Install recovery test tools
        run: sudo apt-get update && sudo apt-get install -y age postgresql-client-16

      - name: Compute the shard packages
        run: |
          python3 scripts/ci-integration-shards.py --check
          python3 scripts/ci-integration-shards.py --shard "${{ matrix.shard }}" > /tmp/shard-packages.txt
          wc -l /tmp/shard-packages.txt

      - name: Test against PostgreSQL
        env:
          URMAIL_TEST_DATABASE_URL: postgres://urmail:urmail@127.0.0.1:5432/urmail_${{ matrix.shard }}?sslmode=disable
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          xargs go test -race -timeout 20m -p 1 < /tmp/shard-packages.txt

  native-webmail:
    name: Native webmail (Postfix and Dovecot)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup-go-toolchain
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go module downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the disposable mail protocol fixture
        run: docker build -t urmail-native-webmail-ci:22.04 -f .github/fixtures/native-webmail.Dockerfile .github/fixtures

      - name: Exercise real native mail protocols and HTTP
        run: |
          python3 scripts/native-webmail-protocol-acceptance.py \
            --image urmail-native-webmail-ci:22.04 \
            --evidence tmp/native-webmail-ci

      - name: Exercise spam milter and recipient-specific delivery rules
        env:
          URMAIL_POSTFIX_TEST_IMAGE: urmail-native-webmail-ci:22.04
          URMAIL_SIEVE_TEST_IMAGE: urmail-native-webmail-ci:22.04
        run: go test ./internal/mailspam ./internal/mail/dovecot -count=1

      - name: Preserve protocol diagnostics in the job log
        if: always()
        run: |
          if [ -d tmp/native-webmail-ci ]; then
            find tmp/native-webmail-ci -maxdepth 1 -type f \
              \( -name '*.log' -o -name 'runtime-result.json' \) \
              -print -exec cat {} \;
          fi

  embed:
    name: Embedded frontend
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup-go-toolchain
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go module downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ runner.arch }}-

      - uses: ./.github/actions/setup-node-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build the frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Copy the bundle into the embed directory
        run: |
          rm -rf internal/web/dist
          cp -R web/dist internal/web/dist

      - name: Build the binary
        run: go build -o /tmp/urmaild ./cmd/urmaild

      - name: Verify the bundle is inside the binary
        run: |
          if ! strings /tmp/urmaild | grep "assets/index" >/dev/null; then
            echo "the frontend bundle is missing from the binary" >&2
            exit 1
          fi

  package-smoke:
    name: Package smoke
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup-go-toolchain
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go module downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ runner.arch }}-

      - uses: ./.github/actions/setup-node-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Embed frontend
        run: |
          rm -rf internal/web/dist
          cp -R web/dist internal/web/dist
          touch internal/web/dist/.gitkeep

      - name: Build binaries and deb
        run: |
          make build-go
          bash packaging/deb/build.sh 0.0.0-ci

      - name: Inspect package contents
        run: |
          deb=$(ls dist/urmail_0.0.0-ci_*.deb | head -1)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | grep -E 'urmaild$|urmaild-agent$|urmail-archive|urmail-cert-renew.timer|bootstrap.sql'
          test -f dist/urmail_0.0.0-ci_*.deb

  shellcheck:
    name: Shell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Lint the shell scripts
        run: |
          find installer packaging scripts -name '*.sh' -print0 \
            | xargs -0 -r shellcheck --severity=warning --external-sources

      - name: Test release CI gate
        run: python3 scripts/test-verify-release-ci.py

      - name: Syntax check
        run: find . -name '*.sh' -not -path './web/*' -print0 | xargs -0 -r -n1 bash -n

  browser:
    name: Development stack and browser
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go-toolchain
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go module downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-node-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install frontend and browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start development stack
        run: |
          make dev > /tmp/urmail-dev.log 2>&1 &
          for attempt in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null && curl -fsS http://127.0.0.1:8080/api/v1/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/urmail-dev.log
          exit 1
      - name: Exercise real HTTP and browser
        run: |
          export URMAIL_ACCEPTANCE_EMAIL=admin@example.test
          export URMAIL_ACCEPTANCE_PASSWORD="$(cat tmp/dev/admin-password)"
          python3 scripts/remediation-http-smoke.py --disposable --base-url http://127.0.0.1:8080
          cd web
          URMAIL_E2E_BASE_URL=http://127.0.0.1:5173 URMAIL_E2E_EMAIL="$URMAIL_ACCEPTANCE_EMAIL" URMAIL_E2E_PASSWORD="$URMAIL_ACCEPTANCE_PASSWORD" npx playwright test
          npm run lint
      - name: Stop development stack
        if: always()
        run: make dev-down

  install:
    name: Linux installation (${{ matrix.os }}, ${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.frontend == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go-toolchain
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go module downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-node-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build the installable candidate
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cd web
          npm ci
          cd ..
          make build VERSION=0.0.0-ci
          bash packaging/deb/build.sh 0.0.0-ci
      - name: Verify installer configuration preservation
        run: python3 -m unittest discover -s installer -p 'test_*.py'
      - name: Exercise installer and release download contracts
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          sudo env URMAIL_MYHOSTNAME=box.example.test URMAIL_PRIMARY_DOMAIN=example.test \
            URMAIL_PUBLIC_IPV4=127.0.0.1 URMAIL_NAMESERVERS=ns1.example.test \
            URMAIL_ADMIN_EMAIL=admin@example.test URMAIL_ADMIN_PASSWORD=CIOnlyPassword123 \
            python3 scripts/test-release-installer.py --disposable \
            --package "$(pwd)/dist/urmail_0.0.0-ci_${ARCH}.deb" --version 0.0.0-ci
          sudo urmailctl config status --wait 90s
      - name: Preserve service diagnostics
        if: failure()
        run: sudo journalctl -u urmaild -u urmaild-agent --no-pager -n 100

  security:
    name: Security dependencies
    needs: changes
    if: needs.changes.outputs.deps == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go-toolchain
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go module downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-node-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache Go tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/bin
          key: gobin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yaml') }}
          restore-keys: |
            gobin-${{ runner.os }}-${{ runner.arch }}-
      - name: Check reachable Go vulnerabilities
        run: |
          bash scripts/ci-go-install.sh golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Audit locked npm dependencies
        run: npm audit --prefix web --audit-level=moderate --registry=https://registry.npmjs.org
