name: Upgrade rig acceptance

# Phase 2 QA: run the upgrade-chain acceptance suite on a clean
# ubuntu-24.04 runner (no host port conflicts, no nested docker namespaces).
# Triggers on push to fix/phase2-scripts and via workflow_dispatch.
# NOT part of the tag release chain, NOT in verify-release-ci REQUIRED_JOBS.

on:
  workflow_dispatch:
  push:
    branches:
      - fix/phase2-scripts
    paths:
      - 'scripts/upgrade-rig-acceptance.sh'
      - 'upgrade.sh'
      - 'compose.yaml'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - '.github/workflows/upgrade-rig-acceptance.yaml'

permissions:
  contents: read

jobs:
  upgrade-rig-acceptance:
    name: Upgrade rig acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up data dirs
        run: |
          sudo install -d -o root -g root -m 0750 data/maintenance
          for d in db mail certs config backup holds; do
            sudo install -d -o 5000 -g 5000 -m 0750 "data/$d"
          done
          sudo install -d -m 0700 data/db/pg
          sudo chown -R 70:70 data/db/pg

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s/^URMAIL_PG_PASSWORD=.*/URMAIL_PG_PASSWORD=rig-$(openssl rand -hex 12)/" .env
          sed -i "s/^URMAIL_MYHOSTNAME=.*/URMAIL_MYHOSTNAME=rig-acceptance.test/" .env
          sed -i "s|^URMAIL_PRIMARY_DOMAIN=.*|URMAIL_PRIMARY_DOMAIN=rig-acceptance.test|" .env

      - name: Create local test tags
        run: |
          git tag -f v9.9.9 HEAD
          git tag -f v9.9.8 HEAD~1

      - name: Run upgrade-chain acceptance suite
        run: |
          set -o pipefail
          chmod +x scripts/upgrade-rig-acceptance.sh
          sudo bash scripts/upgrade-rig-acceptance.sh 2>&1 | tee "$RUNNER_TEMP/rig-acceptance-output.log"
          cp "$RUNNER_TEMP/rig-acceptance-output.log" ./rig-acceptance-output.log

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upgrade-rig-evidence
          path: |
            data/upgrade-evidence-*.log
            rig-acceptance-output.log
          retention-days: 30
