name: Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.27.3"
  GOPROXY: https://goproxy.cn,direct
  npm_config_registry: https://registry.npmmirror.com

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend and binaries
        run: |
          version=$(cat VERSION)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then version=${GITHUB_REF_NAME#v}; fi
          make build VERSION="$version"
      - name: Build versioned package and release manifest
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          version=$(cat VERSION)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then version=${GITHUB_REF_NAME#v}; fi
          bash packaging/deb/build.sh "$version"
          python3 scripts/release-manifest.py "$version" "$ARCH" dist
      - name: Upload package and manifest
        uses: actions/upload-artifact@v4
        with:
          name: urmail-deb-${{ matrix.arch }}
          path: dist/*
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
