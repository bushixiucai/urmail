name: Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Phase 2 (compose form, ARCH-PLAN §1.7): releases distribute SOURCE — the
# operator builds locally via `docker compose build && up -d`. The deb
# packaging/signing/upload job from the v0.6.x chain is retired on this
# branch; this workflow now only enforces the tag ↔ CI-green gate
# (verify-release-ci, whose REQUIRED_JOBS include the compose smoke job).
# The v0.6.x chain keeps working from its own released tags, which still
# carry the retired workflow definition.
jobs:
  verify-ci:
    name: Verify exact release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require exact-SHA CI and main ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 scripts/verify-release-ci.py
