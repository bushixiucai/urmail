# urMail.cn — preserve-external-web hybrid admin locations
# Include inside the existing box HTTPS server block (do not replace whole vhost).
# Requires packaging/nginx/00-urmail-upstream.conf in http context.
# Retired legacy collaboration locations must be removed before including this file.
# Preserves ACME, static sites, NSD, OpenDKIM and stored mailbox data.
# Live install path: /etc/nginx/snippets/urmail-admin-panel.conf

location = / {
	proxy_pass http://urmail_backend;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Connection "";
	proxy_read_timeout 120s;
	add_header X-Frame-Options "DENY" always;
	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

location ^~ /api/v1/ {
	proxy_pass http://urmail_backend;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Connection "";
	proxy_read_timeout 120s;
	add_header X-Frame-Options "DENY" always;
	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	client_max_body_size 16m;
}

