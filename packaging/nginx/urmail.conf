# urMail.cn — nginx configuration.
#
# nginx terminates TLS and proxies to the management service on loopback.
# The frontend is embedded in the Go binary, so there is no static root to
# serve and no separate deployment for the web interface.
#
# Per-domain server blocks are generated by urmaild and written to
# /etc/nginx/conf.d/urmail/domains.conf. This file provides the defaults.

# The management API is only reachable through this proxy.
upstream urmail_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Shared defaults for the ACME HTTP-01 challenge.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/urmail-acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# The admin panel. It is served over TLS only and is not indexed.
server {
    # "listen ... http2" is compatible with nginx 1.18 (Ubuntu 22.04) and
    # 1.25+ (Ubuntu 24.04). The explicit hostname is injected by the installer;
    # "_" is the safe default until that happens.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /var/lib/urmail-agent/certs/panel/fullchain.pem;
    ssl_certificate_key /var/lib/urmail-agent/certs/panel/privkey.pem;
    include /etc/nginx/snippets/urmail-ssl.conf;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The frontend ships no inline scripts, so the policy can be strict.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 16m;

    # Metrics are for the local Prometheus scraper; never expose them through
    # the public panel vhost.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://urmail_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
