# Retained Roundcube 1.7.5 only. Installation remains blocked until M8 import proof.
server {
    listen 127.0.0.1:8888;
    server_name _;
    root /usr/local/lib/roundcubemail/public_html;
    client_max_body_size 128m;
    location = /mail { return 308 /mail/; }
    location ^~ /mail/ { rewrite ^/mail/(.*)$ /$1 last; }
    location = / { rewrite ^ /index.php last; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/local/lib/roundcubemail/public_html/index.php;
        fastcgi_param SCRIPT_NAME /mail/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/urmail-roundcube.sock;
    }
    # Roundcube 1.7 static.php performs the upstream file allowlist checks.
    # PATH_INFO is data; SCRIPT_FILENAME is always this one fixed entry point.
    location ~ ^/static\.php(?<roundcube_path_info>/.*)?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/local/lib/roundcubemail/public_html/static.php;
        fastcgi_param SCRIPT_NAME /mail/static.php;
        fastcgi_param PATH_INFO $roundcube_path_info;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/urmail-roundcube.sock;
    }
    location ~ ^/(plugins|skins|program)/ {
        rewrite ^/(.*)$ /static.php/$1 last;
    }
    location = /favicon.ico { rewrite ^ /static.php/skins/elastic/images/favicon.ico last; }
    location ~ \.php(?:/|$) { deny all; }
    location / { return 404; }
}
