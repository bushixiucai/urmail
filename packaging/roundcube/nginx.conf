# Loopback-only Roundcube HTTP upstream; outer managed TLS proxy owns /mail/.
server {
    listen 127.0.0.1:8888;
    server_name _;
    root /var/lib/roundcube/public_html;
    index index.php;
    client_max_body_size 25m;
    location = /mail { return 308 /mail/; }
    location /mail/ {
        rewrite ^/mail/(.*)$ /$1 last;
    }
    location ~ ^/(config|temp|logs|SQL|bin|installer|vendor|tests)/ { deny all; }
    location ~ ^/program/(include|lib|steps)/ { deny all; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/index\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/lib/roundcube/public_html/index.php;
        fastcgi_param SCRIPT_NAME /mail/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/urmail-roundcube.sock;
    }
    location ~ \.php$ { deny all; }
}
