global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/urmail/observability/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
scrape_configs:
  - job_name: urmail
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/urmail/observability/metrics.token
    static_configs:
      - targets: ['127.0.0.1:8080']
