services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urmail
      POSTGRES_PASSWORD: urmail
      POSTGRES_DB: urmail
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urmail -d urmail"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
