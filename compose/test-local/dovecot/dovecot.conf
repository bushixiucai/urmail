# LOCAL TEST dovecot.conf (compose/test-local).  NOT a product config.
# Static passwd-file auth stands in for the product config generator + SQL
# userdb, which are not implemented on this branch.
base_dir = /var/run/dovecot/
state_dir = /var/lib/dovecot/state
log_path = /dev/stdout
info_log_path = /dev/stdout
protocols = imap lmtp
listen = *
ssl = yes
ssl_cert = </etc/urmail/tls/cert.pem
ssl_key = </etc/urmail/tls/key.pem
disable_plaintext_auth = no
auth_mechanisms = plain login
auth_username_format = %Lu
login_greeting = urmail-phase2-local ready

mail_location = maildir:/srv/urmail/data/mail/%d/%n/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000

passdb {
  driver = passwd-file
  args = /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=5000 gid=5000 home=/srv/urmail/data/mail/%d/%n
}

namespace inbox {
  inbox = yes
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

service auth {
  inet_listener authclient {
    port = 12345
  }
}

!include_try /usr/share/dovecot/protocols.d/*.protocol
