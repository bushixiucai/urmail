# urMail compose skeleton placeholder dovecot.conf (agent config generator
# renders the real one). Loopback-only + ssl=no: skeleton safety posture.
# D1: the obsolete top-level `listen = 127.0.0.1:10143` made dovecot 2.3
# fold the port into BOTH default inet listeners (imap and imaps), so
# doveconf died with "duplicate listener: 10143:" and every fresh compose
# install crash-looped. Modern per-service syntax below keeps the same
# loopback-only 10143 posture (a plain deletion would fall back to the
# wildcard default port 143 on a host-network container).
protocols = imap
ssl = no
disable_plaintext_auth = no
service imap-login {
    inet_listener imap {
        address = 127.0.0.1
        port = 10143
    }
    # ssl=no: never open the implicit TLS listener of the skeleton.
    inet_listener imaps {
        port = 0
    }
}
mail_location = maildir:/srv/urmail/data/mail/%d/%n
first_valid_uid = 5000
last_valid_uid = 5000
mail_uid = vmail
mail_gid = vmail
auth_mechanisms = plain login
!include_try /usr/share/dovecot/protocols.d/*.protocol
