# urMail compose skeleton placeholder dovecot.conf (agent config generator
# renders the real one). Loopback-only + ssl=no: skeleton safety posture.
listen = 127.0.0.1:10143
protocols = imap
ssl = no
disable_plaintext_auth = no
mail_location = maildir:/srv/urmail/data/mail/%d/%n
first_valid_uid = 5000
last_valid_uid = 5000
mail_uid = vmail
mail_gid = vmail
auth_mechanisms = plain login
!include_try /usr/share/dovecot/protocols.d/*.protocol
