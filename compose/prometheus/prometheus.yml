global:
  scrape_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  # GRAFANA-DESIGN §2.1/§5: urmaild scraped on the compose bridge (option A:
  # URMAIL_LISTEN_ADDR=<private>:8080 + private-network bearer gate; the
  # historical loopback-only posture is unchanged by default). The token file
  # holds URMAIL_METRICS_TOKEN (>=32 chars, Vault-managed).
  - job_name: urmaild
    # The machine-credential gate lives on /internal/metrics (router.go);
    # the default /metrics path sits behind the admin session gate.
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["urmaild:8080"]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics.token
  # node-exporter must be reachable from the bridge network the
  # Prometheus container sits on (QA PR150 P1-3): target the service name
  # and publish the exporter on the compose network — the compose service
  # definition (DevOps) aligns with GRAFANA-DESIGN §5 by NOT using host
  # network loopback for this exporter.
  - job_name: node_exporter
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
